<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filter-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 14px;
        }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-select {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 14px;
            background-color: white;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid #dee2e6;
            color: #6c757d;
        }
        
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .room-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e9ecef;
        }
        
        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .room-image {
            height: 150px;
            width: 100%;
            object-fit: cover;
        }
        
        .room-info {
            padding: 15px;
        }
        
        .room-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .status-available {
            background-color: #d4edda;
            color: #28a745;
        }
        
        .status-occupied {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .status-maintenance {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .room-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .room-code {
            color: #6c757d;
            font-weight: normal;
            font-size: 14px;
        }
        
        .room-details {
            margin-top: 10px;
        }
        
        .room-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            color: #495057;
            font-size: 14px;
        }
        
        .room-detail i {
            width: 20px;
            color: #6c757d;
        }
        
        .room-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .action-icon {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        
        .action-icon:hover {
            background-color: #f8f9fa;
        }
        
        .edit-btn:hover {
            color: #007bff;
        }
        
        .delete-btn:hover {
            color: #dc3545;
        }
        
        .view-btn:hover {
            color: #28a745;
        }
        
        .toggle-status-btn:hover {
            color: #ffc107;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
        
        .pagination-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .pagination-item:hover {
            background-color: #f8f9fa;
        }
        
        .pagination-item.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #343a40;
        }
        
        .modal-close {
            font-size: 24px;
            color: #6c757d;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #343a40;
        }
        
        .form-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.2);
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
        }
        .menu-item.active {
            background-color: #28a745;
            color: white;
        }
        @media (max-width: 768px) {
            .filter-container {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                width: 100%;
            }
            
            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
        .menu-item.logo-item {
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            max-width: 100%;
            object-fit: contain;
        }

        .menu-item.active {
            background-color: #28a745;
            color: white;
        }

        /* Add styles for equipment options */
        .equipment-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }
        
        .equipment-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }
        
        .equipment-count {
            width: 60px;
            padding: 5px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        
        .form-help {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #6c757d;
        }
        
        /* Add custom checkbox style */
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        /* Confirm delete modal */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1100;
            justify-content: center;
            align-items: center;
        }
        
        .confirm-content {
            background-color: white;
            border-radius: 10px;
            width: 400px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .confirm-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #dc3545;
        }
        
        .confirm-message {
            margin-bottom: 20px;
            color: #495057;
        }
        
        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        
        /* Add image preview styles */
        .image-upload-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .image-preview {
            min-height: 150px;
            border: 1px dashed #ced4da;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        
        .image-preview-placeholder {
            color: #6c757d;
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }
        
        .image-preview-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .image-preview-remove:hover {
            opacity: 1;
        }

        /* Style for detail modal */
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1200;
            justify-content: center;
            align-items: center;
        }
        
        .room-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 15px;
        }
        
        .room-detail-header h2 {
            margin: 0;
            font-size: 24px;
            color: #343a40;
        }
        
        .room-detail-status {
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .room-detail-status.available {
            background-color: #d4edda;
            color: #28a745;
        }
        
        .room-detail-status.occupied {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .room-detail-status.maintenance {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .room-detail-image {
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .room-detail-image img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }
        
        .room-detail-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .detail-item {
            padding: 10px;
            border-bottom: 1px solid #f8f9fa;
        }
        
        .detail-label {
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: #343a40;
        }
        
        .room-detail-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body class="admin-dashboard">
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item logo-item">
                <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
            </div>
            <div class="menu-item" id="overview-menu-item" data-title="Trang chủ">
                <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="menu-item active" id="room-management-menu-item" data-title="Quản lý phòng">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="menu-item" id="user-management-menu-item" data-title="Quản lý người dùng">
                <i class="fas fa-users"></i>
            </div>
            <div class="menu-item" id="booking-management-menu-item" data-title="Quản lý đặt phòng">
                <i class="fas fa-calendar-check"></i>
            </div>
            <div class="menu-item" id="notifications-menu-item" data-title="Thông báo">
                <i class="fas fa-bell"></i>
            </div>
            <div class="menu-item" id="statistics-menu-item" data-title="Thống kê">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Quản lý phòng</h1>
            <div class="user-controls">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        
        <div class="content-container">
            <div class="filter-container">
                <div class="search-box">
                    <input type="text" placeholder="Tìm kiếm phòng theo tên, ID, hoặc loại...">
                    <div class="search-icon">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                
                <select class="filter-select" id="status-filter">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="available">Còn trống</option>
                    <option value="occupied">Đang sử dụng</option>
                    <option value="maintenance">Bảo trì</option>
                </select>
                
                <select class="filter-select" id="type-filter">
                    <option value="all">Tất cả loại phòng</option>
                    <option value="conference">Phòng hội nghị</option>
                    <option value="meeting">Phòng họp</option>
                    <option value="study">Phòng học</option>
                    <option value="training">Phòng đào tạo</option>
                </select>
                
                <div class="action-buttons">
                    <button class="btn btn-outline" id="export-btn">
                        <i class="fas fa-download"></i>
                        Xuất file
                    </button>
                    <button class="btn btn-primary" id="add-room-btn">
                        <i class="fas fa-plus"></i>
                        Thêm phòng
                    </button>
                </div>
            </div>
            
            <div class="card-container" id="room-grid">
                <!-- Room cards will be generated here dynamically -->
            </div>
            
            <div class="pagination">
                <div class="pagination-item">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <div class="pagination-item active">1</div>
                <div class="pagination-item">2</div>
                <div class="pagination-item">3</div>
                <div class="pagination-item">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Room Modal -->
    <div class="modal" id="room-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Thêm phòng mới</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="room-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="room-name">Tên phòng (số phòng)</label>
                            <input type="text" class="form-input" id="room-name" placeholder="Ví dụ: 101, 102, A101...">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="room-location-select">Vị trí (tòa nhà)</label>
                            <select class="form-input" id="room-location-select">
                                <option value="">Chọn tòa nhà</option>
                                <option value="H1">Tòa H1</option>
                                <option value="H2">Tòa H2</option>
                                <option value="H3">Tòa H3</option>
                                <option value="H6">Tòa H6</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-id">Mã phòng</label>
                        <input type="text" class="form-input" id="room-id" placeholder="Tự động tạo" readonly>
                        <small class="form-help">Mã phòng sẽ được tạo tự động từ vị trí và tên phòng (Ví dụ: H1.101)</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-type">Loại phòng</label>
                        <select class="form-input" id="room-type">
                            <option value="">Chọn loại phòng</option>
                            <option value="classroom">Phòng học</option>
                            <option value="meeting">Phòng họp</option>
                            <option value="lab">Phòng thí nghiệm</option>
                            <option value="computer">Phòng máy tính</option>
                            <option value="lecture">Giảng đường</option>
                            <option value="study">Không gian học tập</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="room-capacity">Sức chứa</label>
                            <input type="number" class="form-input" id="room-capacity" placeholder="Số người">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="room-status">Trạng thái</label>
                            <select class="form-input" id="room-status">
                                <option value="available">Còn trống</option>
                                <option value="occupied">Đang sử dụng</option>
                                <option value="maintenance">Bảo trì</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-equipment">Thiết bị</label>
                        <div class="equipment-options">
                            <div class="equipment-item">
                                <input type="checkbox" id="projector" name="equipment" value="projector">
                                <label for="projector">Máy chiếu</label>
                                <input type="number" class="equipment-count" id="projector-count" min="0" max="10" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="computer" name="equipment" value="computer">
                                <label for="computer">Máy tính</label>
                                <input type="number" class="equipment-count" id="computer-count" min="0" max="100" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="air_conditioner" name="equipment" value="air_conditioner">
                                <label for="air_conditioner">Điều hòa</label>
                                <input type="number" class="equipment-count" id="air_conditioner-count" min="0" max="10" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="whiteboard" name="equipment" value="whiteboard">
                                <label for="whiteboard">Bảng</label>
                                <input type="number" class="equipment-count" id="whiteboard-count" min="0" max="10" value="0">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-image">Hình ảnh phòng</label>
                        <div class="image-upload-container">
                            <input type="file" class="form-input" id="room-image" accept="image/*">
                            <div class="image-preview" id="image-preview"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-room-description">Mô tả phòng</label>
                        <textarea class="form-input" id="edit-room-description" rows="3" placeholder="Nhập thông tin mô tả chi tiết về phòng"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancel-btn">Hủy</button>
                <button class="btn btn-primary" id="save-room-btn">Lưu phòng</button>
            </div>
        </div>
    </div>
    
    <!-- Confirm Delete Modal -->
    <div class="confirm-modal" id="confirm-delete-modal">
        <div class="confirm-content">
            <div class="confirm-title">
                <i class="fas fa-exclamation-triangle"></i> Xác nhận xóa phòng
            </div>
            <div class="confirm-message">
                Bạn có chắc chắn muốn xóa phòng "<span id="delete-room-id"></span>"? Hành động này không thể hoàn tác.
            </div>
            <div class="confirm-actions">
                <button class="btn btn-cancel" id="cancel-delete-btn">Hủy</button>
                <button class="btn btn-delete" id="confirm-delete-btn">Xóa phòng</button>
            </div>
        </div>
    </div>

    <script>
        // API endpoints
        const API_BASE_URL = '/api';
        const ENDPOINTS = {
            ROOMS: `${API_BASE_URL}/rooms`,
            ROOM_TYPES: `${API_BASE_URL}/rooms/types`
        };

        // Initialize rooms data
        let roomsData = [];
        let roomTypes = [];
        
        // Navigation setup
        document.addEventListener('DOMContentLoaded', function() {
            setupNavigation();
            initializeRoomsPage();
            setupFormEventListeners();
        });

        function setupNavigation() {
            document.getElementById('overview-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-overview.html';
            });
            
            document.getElementById('room-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-room-management.html';
            });
            
            document.getElementById('user-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-user-management.html';
            });
            
            document.getElementById('notifications-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-notifications.html';
            });

            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                const countInput = document.getElementById(`${checkbox.value}-count`);
                
                // Enable/disable count input based on checkbox
                checkbox.addEventListener('change', function() {
                    countInput.disabled = !this.checked;
                    if (!this.checked) {

        function getEquipmentData() {
            let equipment = {};
            
            // Loop through all equipment checkboxes
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                if (checkbox.checked) {
                    const countInput = document.getElementById(`${checkbox.value}-count`);
                    const count = parseInt(countInput.value) || 1;
                    equipment[checkbox.value] = count;
                }
            });
            
            return equipment;
        }
        
        function populateEquipmentInputs(facilities) {
            // Reset all checkboxes first
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                checkbox.checked = false;
                const countInput = document.getElementById(`${checkbox.value}-count`);
                countInput.value = 0;
                countInput.disabled = true;
            });
            
            if (!facilities) return;
            
            let facilitiesObj = {};
            
            // Parse facilities if it's a string
            if (typeof facilities === 'string') {
                try {
                    facilitiesObj = JSON.parse(facilities);
                } catch (e) {
                    console.error('Error parsing facilities:', e);
                    // If can't parse, split by comma and set value to 1
                    const facilitiesArray = facilities.split(',').map(item => item.trim());
                    facilitiesArray.forEach(item => {
                        facilitiesObj[item] = 1;
                    });
                }
            } else if (typeof facilities === 'object') {
                facilitiesObj = facilities;
            }
            
            // Set checkbox and count for each equipment
            for (const [key, value] of Object.entries(facilitiesObj)) {
                const checkbox = document.querySelector(`input[name="equipment"][value="${key}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                    const countInput = document.getElementById(`${key}-count`);
                    countInput.value = value;
                    countInput.disabled = false;
                }
            }
        }
        
        function populateRoomTypeFilter(types) {
            const typeFilter = document.getElementById('type-filter');
            
            // Clear existing options except the first one
            while (typeFilter.options.length > 1) {
                typeFilter.remove(1);
            }
            
            // Add room type options
            const roomTypeLabels = {
                'classroom': 'Phòng học',
                'meeting': 'Phòng họp',
                'lab': 'Phòng thí nghiệm',
                'computer': 'Phòng máy tính',
                'lecture': 'Giảng đường',
                'study': 'Không gian học tập'
            };
            
            Object.entries(roomTypeLabels).forEach(([value, label]) => {
                const option = document.createElement('option');
                option.value = value;

            if (statusValue !== 'all') {

                filteredRooms = filteredRooms.filter(room => room.room_type === typeValue);
            }
            
            if (searchValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.room_name?.toLowerCase().includes(searchValue) || 
                    room.id?.toString().toLowerCase().includes(searchValue) || 
                    room.location?.toLowerCase().includes(searchValue)

            }
            
            generateRoomCards(filteredRooms);

        async function saveRoom() {
            const form = document.getElementById('room-form');
            const roomId = form.dataset.roomId;
            // alert(document.getElementById('edit-room-description').value);
            
            // Lấy dữ liệu input
            const roomName = document.getElementById('room-name').value.trim();
            const location = document.getElementById('room-location-select').value;
            // const description = document.getElementById('edit-room-description').value;
            // alert(description);
            // Validate dữ liệu chính
            if (!roomName) {
                alert('Vui lòng nhập tên phòng!');
                return;
            }
            
            if (!location) {
                alert('Vui lòng chọn vị trí phòng!');
                return;
            }
            
            // Lấy dữ liệu thiết bị
            const equipment = getEquipmentData();
            
            // Tạo đối tượng dữ liệu để gửi lên server
            const roomData = {
                room_name: roomName,
                location: location,
                capacity: parseInt(document.getElementById('room-capacity').value) || 0,
                room_type: document.getElementById('room-type').value,
                description: document.getElementById('edit-room-description').value,
                status: document.getElementById('room-status').value,
                facilities: equipment,
                updated_at: new Date().toISOString()
            };
            // Nếu là phòng mới, thêm ngày tạo
            if (!roomId) {
                roomData.created_at = new Date().toISOString();
            }
            
            try {
                let response;
                let endpoint = roomId ? `${ENDPOINTS.ROOMS}/${roomId}` : ENDPOINTS.ROOMS;
                
                // Gửi dữ liệu lên server
                response = await fetch(endpoint, {
                    method: roomId ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(roomData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Không thể lưu thông tin phòng');
                }
                
                // Xử lý upload ảnh nếu có file được chọn
                const imageInput = document.getElementById('room-image');
                if (imageInput.files && imageInput.files[0]) {
                    const responseData = await response.json();
                    const savedRoomId = responseData.id || roomId;
                    
                    // Upload ảnh sau khi đã lưu thông tin phòng
                    const formData = new FormData();
                    formData.append('image', imageInput.files[0]);
                    
                    const imageResponse = await fetch(`${ENDPOINTS.ROOMS}/${savedRoomId}/image`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    
                    if (!imageResponse.ok) {
                        console.warn('Không thể tải lên ảnh phòng, nhưng thông tin phòng đã được lưu.');
                    }
                }
                
                // Xử lý xóa ảnh nếu người dùng đã chọn xóa
                if (form.dataset.removeImage === 'true' && roomId) {
                    const deleteImageResponse = await fetch(`${ENDPOINTS.ROOMS}/${roomId}/image`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    
                    if (!deleteImageResponse.ok) {
                        console.warn('Không thể xóa ảnh phòng, nhưng thông tin phòng đã được lưu.');
                    }
                }
                
                // Tải lại danh sách phòng và đóng modal
                await loadRooms();
                generateRoomCards(roomsData);
                closeModal();
                
                alert(roomId ? 'Phòng đã được cập nhật thành công!' : 'Đã thêm phòng mới thành công!');
            } catch (error) {
                console.error('Error saving room:', error);
                alert(`Lỗi khi lưu thông tin phòng: ${error.message}`);
            }
        }

        function generateRoomCards(rooms) {
            const roomGrid = document.getElementById('room-grid');
            roomGrid.innerHTML = '';
            
            if (!rooms || rooms.length === 0) {
                roomGrid.innerHTML = '<div class="no-data">Không tìm thấy phòng nào phù hợp</div>';
                return;
            }
            
            // Room type labels
            const roomTypeLabels = {
                'classroom': 'Phòng học',
                'meeting': 'Phòng họp',
                'lab': 'Phòng thí nghiệm',
                'computer': 'Phòng máy tính',
                'lecture': 'Giảng đường',
                'study': 'Không gian học tập'
            };
            
            // Status texts
            const statusTexts = {
                'available': 'Còn trống',
                'occupied': 'Đang sử dụng',
                'maintenance': 'Bảo trì'
            };
            
            // Create room cards
            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                
                // Get room type label
                const roomTypeLabel = roomTypeLabels[room.room_type] || room.room_type;
                
                // Get status text and CSS class
                const statusText = statusTexts[room.status] || 'Không rõ';
                let statusClass = '';
                
                switch(room.status) {
                    case 'available': statusClass = 'status-available'; break;
                    case 'occupied': statusClass = 'status-occupied'; break;
                    case 'maintenance': statusClass = 'status-maintenance'; break;
                }
                
                // Parse facilities if it's a string
                let facilitiesObj = {};
                try {
                    if (room.facilities) {
                        if (typeof room.facilities === 'string') {
                            facilitiesObj = JSON.parse(room.facilities);
                        } else if (typeof room.facilities === 'object') {
                            facilitiesObj = room.facilities;
                        }
                    }
                } catch (e) {
                    console.error('Error parsing facilities for room', room.id, e);
                    
                    // Nếu không thể parse, hiển thị dạng tên thiết bị thay vì số
                    try {
                        if (typeof room.facilities === 'string') {
                            const facilityPairs = room.facilities.split(',').map(pair => pair.trim());
                            facilitiesObj = {};
                            facilityPairs.forEach(pair => {
                                const [key, value] = pair.split(':').map(item => item.trim());
                                facilitiesObj[key] = value;
                            });
                        }
                    } catch (innerError) {
                        console.error('Cannot format facilities string:', innerError);
                    }
                }
                
                // Create facilities text
                const facilitiesArray = [];
                const equipmentLabels = {
                    'projector': 'Máy chiếu',
                    'computer': 'Máy tính',
                    'air_conditioner': 'Điều hòa',
                    'whiteboard': 'Bảng',
                    '13': 'Máy chiếu',
                    '26': 'Máy tính',
                    '46': 'Điều hòa',
                    '61': 'Bảng'
                };
                
                for (const [key, value] of Object.entries(facilitiesObj)) {
                    if (value && value > 0) {
                        const label = equipmentLabels[key] || key;
                        facilitiesArray.push(`${label}: ${value}`);
                    }
                }
                
                const facilitiesText = facilitiesArray.length > 0 ? facilitiesArray.join(', ') : 'Không có';
                
                // Create card HTML
                card.innerHTML = `
                    <div class="room-info">
                        <div class="room-status ${statusClass}">${statusText}</div>
                        <div class="room-name">
                            ${room.room_name || room.id}
                            <span class="room-code">#${room.id}</span>
                        </div>
                        <div class="room-details">
                            <div class="room-detail">
                                <i class="fas fa-door-open"></i>
                                <span>${roomTypeLabel}</span>
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${room.location || 'Chưa xác định'}</span>
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-users"></i>
                                <span>${room.capacity || 0} người</span>
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-cogs"></i>
                                <span>${facilitiesText}</span>
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-calendar-alt"></i>
                                <span>Cập nhật: ${formatDate(room.updated_at) || 'Chưa cập nhật'}</span>
                            </div>
                        </div>
                        <div class="room-actions">
                            <div class="action-icon edit-btn" data-room-id="${room.id}">
                                <i class="fas fa-edit"></i>
                            </div>
                            <div class="action-icon delete-btn" data-room-id="${room.id}">
                                <i class="fas fa-trash"></i>
                            </div>
                            <div class="action-icon view-btn" data-room-id="${room.id}">
                                <i class="fas fa-eye"></i>
                            </div>
                            <div class="action-icon toggle-status-btn" data-room-id="${room.id}" data-current-status="${room.status}">
                                <i class="fas ${room.status === 'maintenance' ? 'fa-check-circle' : 'fa-ban'}"></i>
                            </div>
                        </div>
                    </div>
                `;
                
                roomGrid.appendChild(card);
                
                // Thêm event listeners cho các nút chỉnh sửa và xóa
                const editBtn = card.querySelector('.edit-btn');
                const deleteBtn = card.querySelector('.delete-btn');
                const viewBtn = card.querySelector('.view-btn');
                const toggleStatusBtn = card.querySelector('.toggle-status-btn');
                
                editBtn.addEventListener('click', function() {
                    openEditModal(this.getAttribute('data-room-id'));
                });

                    deleteRoom(this.getAttribute('data-room-id'));
                });
                
                viewBtn.addEventListener('click', function() {
                    openDetailModal(this.getAttribute('data-room-id'));
                });
                
                toggleStatusBtn.addEventListener('click', function() {
                    const roomId = this.getAttribute('data-room-id');
                    const currentStatus = this.getAttribute('data-current-status');
                    
                    if (currentStatus === 'maintenance') {
                        // Mở lại phòng (đặt về available)
                        toggleRoomStatus(roomId, 'available');
                    } else {
                        // Đóng phòng (đặt về maintenance)
                        toggleRoomStatus(roomId, 'maintenance');
                    }
                });
            });
        }
        
        function exportRoomsData() {
            // Get currently filtered rooms
            const statusValue = document.getElementById('status-filter').value;
            const typeValue = document.getElementById('type-filter').value;
            const searchValue = document.querySelector('.search-box input').value.toLowerCase();
            
            let filteredRooms = [...roomsData];
            
            if (statusValue !== 'all') {
                filteredRooms = filteredRooms.filter(room => room.status === statusValue);
            }
            
            if (typeValue !== 'all') {
                filteredRooms = filteredRooms.filter(room => room.room_type === typeValue);
            }
            
            if (searchValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.room_name?.toLowerCase().includes(searchValue) || 
                    room.id?.toString().toLowerCase().includes(searchValue) || 
                    room.location?.toLowerCase().includes(searchValue)
                );
            }
            
            // Generate CSV content
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Headers
            csvContent += "ID,Tên phòng,Loại phòng,Vị trí,Sức chứa,Trạng thái,Thiết bị\n";
            
            // Data rows
            filteredRooms.forEach(room => {
                const roomTypeLabel = roomTypes.find(t => t.value === room.room_type)?.label || room.room_type;
                let statusText = '';
                
                switch(room.status) {
                    case 'available': statusText = 'Còn trống'; break;
                    case 'occupied': statusText = 'Đang sử dụng'; break;
                    case 'maintenance': statusText = 'Bảo trì'; break;
                    default: statusText = room.status;
                }
                
                csvContent += `${room.id},"${room.room_name}","${roomTypeLabel}","${room.location}",${room.capacity},"${statusText}","${room.facilities || ''}"\n`;
            });
            
            // Create download link
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `danh-sach-phong-${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            
            // Trigger download
            link.click();
            document.body.removeChild(link);
        }

        async function toggleRoomStatus(roomId, newStatus) {
            try {
                const room = roomsData.find(r => r.id.toString() === roomId.toString());
                if (!room) {
                    throw new Error('Không tìm thấy thông tin phòng!');
                }
                
                const message = newStatus === 'maintenance' 
                    ? 'Bạn có chắc chắn muốn đóng phòng này không?' 
                    : 'Bạn có chắc chắn muốn mở lại phòng này không?';
                
                if (!confirm(message)) {
                    return;
                }
                
                // Cập nhật trạng thái phòng
                const updatedRoom = {
                    ...room,
                    status: newStatus,
                    updated_at: new Date().toISOString()
                };
                
                const response = await fetch(`${ENDPOINTS.ROOMS}/${roomId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(updatedRoom)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Không thể cập nhật trạng thái phòng');
                }
                
                // Tải lại danh sách phòng
                await loadRooms();
                generateRoomCards(roomsData);
                
                alert(newStatus === 'maintenance' ? 'Đã đóng phòng thành công!' : 'Đã mở lại phòng thành công!');
            } catch (error) {
                console.error('Error toggling room status:', error);
                alert(`Lỗi: ${error.message}`);
            }
        }
        
        // Room Detail Modal
        function openDetailModal(roomId) {
            const room = roomsData.find(r => r.id.toString() === roomId.toString());
            if (!room) {
                alert('Không tìm thấy thông tin phòng!');
                return;
            }
            
            // Redirect to the room details page
            window.location.href = `admin-room-details.html?id=${roomId}`;
        }
        
        function formatDate(dateString) {
            if (!dateString) return null;
            
            try {
                const date = new Date(dateString);
                
                // Check if date is valid
                if (isNaN(date.getTime())) {
                    return null;
                }
                
                // Format date
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                
                return `${day}/${month}/${year} ${hours}:${minutes}`;
            } catch (error) {
                console.error('Error formatting date:', error);
                return null;
            }
        }
    </script>
