        function formatDate(dateString) {
            if (!dateString) return null;
            
            try {
                const date = new Date(dateString);
                
                // Check if date is valid
                if (isNaN(date.getTime())) {
                    return null;
                }
                
                // Format date
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                
                return `${day}/${month}/${year} ${hours}:${minutes}`;
            } catch (error) {
                console.error('Error formatting date:', error);
                return null;
            }
        }

        async function addIoTDevicesToRoom(roomId, iotDevices) {
            try {
                // Kiểm tra roomId có hợp lệ không
                if (!roomId) {
                    console.error('Không thể thêm thiết bị IoT: Thiếu room_id');
                    return;
                }
                
                // Convert roomId to number if it's a string (optional)
                const roomIdNumber = Number(roomId) || roomId;
                
                // Create each device one by one
                for (const device of iotDevices) {
                    console.log(`Thêm thiết bị IoT: ${device.device_name} (${device.device_type}) cho phòng ${roomIdNumber}`);
                    
                    const deviceData = {
                        device_name: device.device_name,
                        device_type: device.device_type,
                        room_id: roomIdNumber,
                        status: 'off'
                    };
                    
                    // Log device data for debugging
                    console.log('Dữ liệu thiết bị gửi đi:', JSON.stringify(deviceData));
                    
                    const response = await fetch(ENDPOINTS.IOT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify(deviceData)
                    });
                    
                    if (!response.ok) {
                        // Check if response has Content-Type header and it contains 'application/json'
                        const contentType = response.headers.get('Content-Type');
                        let errorMessage = '';
                        
                        if (contentType && contentType.includes('application/json')) {
                            try {
                                const errorData = await response.json();
                                errorMessage = errorData.message || errorData.error || `Error: ${response.status} ${response.statusText}`;
                            } catch (parseError) {
                                console.error('Error parsing error response:', parseError);
                                errorMessage = `Error: ${response.status} ${response.statusText}`;
                            }
                        } else {
                            // If not JSON, get text response
                            const textResponse = await response.text();
                            console.warn('Non-JSON error response:', textResponse);
                            errorMessage = `Error: ${response.status} ${response.statusText}`;
                        }
                        
                        console.error(`Error adding IoT device ${device.device_name}:`, errorMessage);
                        alert(`Lỗi khi thêm thiết bị IoT ${device.device_name}: ${errorMessage}`);
                    } else {
                        console.log(`Thêm thiết bị IoT ${device.device_name} thành công`);
                    }
                }
                
                console.log(`Added ${iotDevices.length} IoT devices to room ${roomId}`);
            } catch (error) {
                console.error('Error adding IoT devices:', error);
                alert(`Lỗi khi thêm thiết bị IoT: ${error.message}`);
            }
        }
        
        async function updateRoomIoTDevices(roomId, newIotDevices) {
            try {
                console.log(`Updating IoT devices for room ${roomId}`);
                
                // Lấy danh sách thiết bị hiện tại
                const response = await fetch(`${ENDPOINTS.IOT}?room_id=${roomId}`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to get current IoT devices: ${response.status} ${response.statusText}`);
                }
                
                // Check if response has Content-Type header and it contains 'application/json'
                const contentType = response.headers.get('Content-Type');
                if (!contentType || !contentType.includes('application/json')) {
                    console.warn(`Expected JSON response but got ${contentType}. Attempting to parse anyway.`);
                }
                
                let currentDevices;
                try {
                    currentDevices = await response.json();
                } catch (parseError) {
                    console.error('Error parsing devices JSON:', parseError);
                    console.log('Response text:', await response.text());
                    throw new Error('Failed to parse device data as JSON');
                }
                
                // Tạo map thiết bị hiện tại theo loại
                const currentDevicesByType = {};
                currentDevices.forEach(device => {
                    if (!currentDevicesByType[device.device_type]) {
                        currentDevicesByType[device.device_type] = [];
                    }
                    currentDevicesByType[device.device_type].push(device);
                });
                
                // Tạo map thiết bị mới theo loại
                const newDevicesByType = {};
                newIotDevices.forEach(device => {
                    if (!newDevicesByType[device.device_type]) {
                        newDevicesByType[device.device_type] = [];
                    }
                    newDevicesByType[device.device_type].push(device);
                });
                
                // Xử lý từng loại thiết bị
                const deviceTypes = [...new Set([
                    ...Object.keys(currentDevicesByType),
                    ...Object.keys(newDevicesByType)
                ])];
                
                for (const deviceType of deviceTypes) {
                    const currentTypeDevices = currentDevicesByType[deviceType] || [];
                    const newTypeDevices = newDevicesByType[deviceType] || [];
                    
                    // Nếu số lượng thiết bị hiện tại ít hơn số lượng mới, thêm thiết bị
                    if (currentTypeDevices.length < newTypeDevices.length) {
                        // Tính số lượng thiết bị cần thêm
                        const devicesToAdd = newTypeDevices.slice(currentTypeDevices.length);
                        // Thêm thiết bị mới với tên tự tăng
                        await addIoTDevicesToRoom(roomId, devicesToAdd);
                    } 
                    // Nếu số lượng thiết bị hiện tại nhiều hơn số lượng mới, xóa bớt
                    else if (currentTypeDevices.length > newTypeDevices.length) {
                        // Tính số lượng thiết bị cần xóa
                        const devicesToRemove = currentTypeDevices.slice(newTypeDevices.length);
                        // Xóa từng thiết bị
                        for (const device of devicesToRemove) {
                            await fetch(`${ENDPOINTS.IOT}/${device.id}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });
                        }
                    }
                }
                
                console.log(`Updated IoT devices for room ${roomId}`);
            } catch (error) {
                console.error('Error updating IoT devices:', error);
                alert(`Lỗi cập nhật thiết bị IoT: ${error.message}`);
            }
        }
