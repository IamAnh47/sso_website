<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filter-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 14px;
        }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-select {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 14px;
            background-color: white;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid #dee2e6;
            color: #6c757d;
        }
        
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .room-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e9ecef;
        }
        
        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .room-image {
            height: 150px;
            width: 100%;
            object-fit: cover;
        }
        
        .room-info {
            padding: 15px;
        }
        
        .room-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .status-available {
            background-color: #d4edda;
            color: #28a745;
        }
        
        .status-occupied {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .status-maintenance {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .room-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .room-code {
            color: #6c757d;
            font-weight: normal;
            font-size: 14px;
        }
        
        .room-details {
            margin-top: 10px;
        }
        
        .room-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            color: #495057;
            font-size: 14px;
        }
        
        .room-detail i {
            width: 20px;
            color: #6c757d;
        }
        
        .room-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .action-icon {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        
        .action-icon:hover {
            background-color: #f8f9fa;
        }
        
        .edit-btn:hover {
            color: #007bff;
        }
        
        .delete-btn:hover {
            color: #dc3545;
        }
        
        .view-btn:hover {
            color: #28a745;
        }
        
        .toggle-status-btn:hover {
            color: #ffc107;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
        
        .pagination-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .pagination-item:hover {
            background-color: #f8f9fa;
        }
        
        .pagination-item.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #343a40;
        }
        
        .modal-close {
            font-size: 24px;
            color: #6c757d;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #343a40;
        }
        
        .form-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.2);
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
        }
        .menu-item.active {
            background-color: #28a745;
            color: white;
        }
        @media (max-width: 768px) {
            .filter-container {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                width: 100%;
            }
            
            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
        .menu-item.logo-item {
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            max-width: 100%;
            object-fit: contain;
        }

        .menu-item.active {
            background-color: #28a745;
            color: white;
        }

        /* Add styles for equipment options */
        .equipment-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }
        
        .equipment-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }
        
        .equipment-count {
            width: 60px;
            padding: 5px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        
        .iot-checkbox {
            margin-left: 10px;
            width: 16px;
            height: 16px;
        }
        
        .iot-label {
            font-size: 12px;
            color: #007bff;
            margin-left: 0;
        }
        
        .form-help {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #6c757d;
        }
        
        /* Add custom checkbox style */
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        /* Confirm delete modal */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1100;
            justify-content: center;
            align-items: center;
        }
        
        .confirm-content {
            background-color: white;
            border-radius: 10px;
            width: 400px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .confirm-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #dc3545;
        }
        
        .confirm-message {
            margin-bottom: 20px;
            color: #495057;
        }
        
        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        
        /* Add image preview styles */
        .image-upload-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .image-preview {
            min-height: 150px;
            border: 1px dashed #ced4da;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        
        .image-preview-placeholder {
            color: #6c757d;
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }
        
        .image-preview-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .image-preview-remove:hover {
            opacity: 1;
        }

        /* Style for detail modal */
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1200;
            justify-content: center;
            align-items: center;
        }
        
        .room-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 15px;
        }
        
        .room-detail-header h2 {
            margin: 0;
            font-size: 24px;
            color: #343a40;
        }
        
        .room-detail-status {
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .room-detail-status.available {
            background-color: #d4edda;
            color: #28a745;
        }
        
        .room-detail-status.occupied {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .room-detail-status.maintenance {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .room-detail-image {
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .room-detail-image img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }
        
        .room-detail-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .detail-item {
            padding: 10px;
            border-bottom: 1px solid #f8f9fa;
        }
        
        .detail-label {
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: #343a40;
        }
        
        .room-detail-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .equipment-display {
            margin-top: 10px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        
        .equipment-item-display {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            padding: 5px 10px;
            background-color: #e9ecef;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .equipment-iot-badge {
            display: inline-block;
            margin-left: 5px;
            padding: 2px 6px;
            background-color: #007bff;
            color: white;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
        }
        
        .empty-equipment-message {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body class="admin-dashboard">
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item logo-item">
                <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
            </div>
            <div class="menu-item" id="overview-menu-item" data-title="Trang chủ">
                <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="menu-item active" id="room-management-menu-item" data-title="Quản lý phòng">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="menu-item" id="user-management-menu-item" data-title="Quản lý người dùng">
                <i class="fas fa-users"></i>
            </div>
            <div class="menu-item" id="booking-management-menu-item" data-title="Quản lý đặt phòng">
                <i class="fas fa-calendar-check"></i>
            </div>
            <div class="menu-item" id="notifications-menu-item" data-title="Thông báo">
                <i class="fas fa-bell"></i>
            </div>
            <div class="menu-item" id="statistics-menu-item" data-title="Thống kê">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Quản lý phòng</h1>
            <div class="user-controls">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        
        <div class="content-container">
            <div class="filter-container">
                <div class="search-box">
                    <input type="text" placeholder="Tìm kiếm phòng theo tên, ID, hoặc loại...">
                    <div class="search-icon">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                
                <select class="filter-select" id="status-filter">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="available">Còn trống</option>
                    <option value="occupied">Đang sử dụng</option>
                    <option value="maintenance">Bảo trì</option>
                </select>
                
                <select class="filter-select" id="type-filter">
                    <option value="all">Tất cả loại phòng</option>
                    <option value="conference">Phòng hội nghị</option>
                    <option value="meeting">Phòng họp</option>
                    <option value="study">Phòng học</option>
                    <option value="training">Phòng đào tạo</option>
                </select>
                
                <div class="action-buttons">
                    <button class="btn btn-outline" id="export-btn">
                        <i class="fas fa-download"></i>
                        Xuất file
                    </button>
                    <button class="btn btn-primary" id="add-room-btn">
                        <i class="fas fa-plus"></i>
                        Thêm phòng
                    </button>
                </div>
            </div>
            
            <div class="card-container" id="room-grid">
                <!-- Room cards will be generated here dynamically -->
            </div>
            
            <div class="pagination">
                <div class="pagination-item">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <div class="pagination-item active">1</div>
                <div class="pagination-item">2</div>
                <div class="pagination-item">3</div>
                <div class="pagination-item">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Room Modal -->
    <div class="modal" id="room-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="room-modal-title">Thêm phòng mới</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="room-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="room-name">Tên phòng (số phòng)</label>
                            <input type="text" class="form-input" id="room-name" placeholder="Ví dụ: 101, 102, A101...">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="room-location-select">Vị trí (tòa nhà)</label>
                            <select class="form-input" id="room-location-select">
                                <option value="">Chọn tòa nhà</option>
                                <option value="H1">Tòa H1</option>
                                <option value="H2">Tòa H2</option>
                                <option value="H3">Tòa H3</option>
                                <option value="H6">Tòa H6</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-id">Mã phòng</label>
                        <input type="text" class="form-input" id="room-id" placeholder="Tự động tạo" readonly>
                        <small class="form-help">Mã phòng sẽ được tạo tự động từ vị trí và tên phòng (Ví dụ: H1.101)</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-type">Loại phòng</label>
                        <select class="form-input" id="room-type">
                            <option value="">Chọn loại phòng</option>
                            <option value="classroom">Phòng học</option>
                            <option value="meeting">Phòng họp</option>
                            <option value="lab">Phòng thí nghiệm</option>
                            <option value="computer">Phòng máy tính</option>
                            <option value="lecture">Giảng đường</option>
                            <option value="study">Không gian học tập</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="room-capacity">Sức chứa</label>
                            <input type="number" class="form-input" id="room-capacity" placeholder="Số người">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="room-status">Trạng thái</label>
                            <select class="form-input" id="room-status">
                                <option value="available">Còn trống</option>
                                <option value="occupied">Đang sử dụng</option>
                                <option value="maintenance">Bảo trì</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-equipment">Thiết bị</label>
                        <div class="equipment-options">
                            <div class="equipment-item">
                                <input type="checkbox" id="projector" name="equipment" value="projector">
                                <label for="projector">Máy chiếu</label>
                                <input type="number" class="equipment-count" id="projector-count" min="0" max="10" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="computer" name="equipment" value="computer">
                                <label for="computer">Máy tính</label>
                                <input type="number" class="equipment-count" id="computer-count" min="0" max="100" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="air_conditioner" name="equipment" value="air_conditioner">
                                <label for="air_conditioner">Điều hòa</label>
                                <input type="number" class="equipment-count" id="air_conditioner-count" min="0" max="10" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="speaker" name="equipment" value="speaker">
                                <label for="speaker">Loa</label>
                                <input type="number" class="equipment-count" id="speaker-count" min="0" max="10" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="light" name="equipment" value="light">
                                <label for="light">Đèn</label>
                                <input type="number" class="equipment-count" id="light-count" min="0" max="20" value="0">
                            </div>
                            <div class="equipment-item">
                                <input type="checkbox" id="fan" name="equipment" value="fan">
                                <label for="fan">Quạt</label>
                                <input type="number" class="equipment-count" id="fan-count" min="0" max="10" value="0">
                            </div>
                        </div>
                        <span class="form-help">Tất cả thiết bị được thêm sẽ tự động kích hoạt IoT (tự động đặt tên: Đèn 1, Đèn 2...)</span>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="room-image">Hình ảnh phòng</label>
                        <div class="image-upload-container">
                            <input type="file" class="form-input" id="room-image" accept="image/*">
                            <div class="image-preview" id="image-preview"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-room-description">Mô tả phòng</label>
                        <textarea class="form-input" id="edit-room-description" rows="3" placeholder="Nhập thông tin mô tả chi tiết về phòng"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancel-btn">Hủy</button>
                <button class="btn btn-primary" id="save-room-btn">Lưu phòng</button>
            </div>
        </div>
    </div>
    
    <!-- Confirm Delete Modal -->
    <div class="confirm-modal" id="confirm-delete-modal">
        <div class="confirm-content">
            <div class="confirm-title">
                <i class="fas fa-exclamation-triangle"></i> Xác nhận xóa phòng
            </div>
            <div class="confirm-message">
                Bạn có chắc chắn muốn xóa phòng "<span id="delete-room-id"></span>"? Hành động này không thể hoàn tác.
            </div>
            <div class="confirm-actions">
                <button class="btn btn-cancel" id="cancel-delete-btn">Hủy</button>
                <button class="btn btn-delete" id="confirm-delete-btn">Xóa phòng</button>
            </div>
        </div>
    </div>

    <script>
        // API endpoints
        const API_BASE_URL = '/api';
        const ENDPOINTS = {
            ROOMS: `${API_BASE_URL}/rooms`,
            ROOM_TYPES: `${API_BASE_URL}/rooms/types`,
            IOT: `${API_BASE_URL}/iot`
        };

        // Initialize rooms data
        let roomsData = [];
        let roomTypes = [];
        
        // Navigation setup
        document.addEventListener('DOMContentLoaded', function() {
            setupNavigation();
            initializeRoomsPage();
            setupFormEventListeners();
        });

        function setupNavigation() {
            document.getElementById('overview-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-overview.html';
            });
            
            document.getElementById('room-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-room-management.html';
            });
            
            document.getElementById('user-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-user-management.html';
            });
            
            document.getElementById('notifications-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-notifications.html';
            });
            document.getElementById('booking-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-booking-management.html';
            });
            document.getElementById('statistics-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-statistics.html';
            });
            
            document.getElementById('logout-btn').addEventListener('click', function() {
                logout();
            });
        }

        function setupFormEventListeners() {
            // Add room modal form event listeners
            const roomNameInput = document.getElementById('room-name');
            const locationSelect = document.getElementById('room-location-select');
            
            // Auto generate room ID from location and room name
            function updateRoomId() {
                const roomName = roomNameInput.value.trim();
                const location = locationSelect.value;
                
                if (roomName && location) {
                    // Create room ID in format "H1.101"
                    document.getElementById('room-id').value = `${location}.${roomName}`;
                } else {
                    document.getElementById('room-id').value = '';
                }
            }
            
            roomNameInput.addEventListener('input', updateRoomId);
            locationSelect.addEventListener('change', updateRoomId);
            
            // Equipment checkbox event listeners
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                const countInput = document.getElementById(`${checkbox.value}-count`);
                
                // Enable/disable count input based on checkbox
                checkbox.addEventListener('change', function() {
                    countInput.disabled = !this.checked;
                    if (!this.checked) {
                        countInput.value = 0;
                    } else {
                        countInput.value = 1;
                    }
                });
                
                // Khi thay đổi số lượng, kiểm tra và cập nhật thiết bị
                countInput.addEventListener('change', function() {
                    // Nếu số lượng = 0, bỏ chọn thiết bị
                    if (parseInt(this.value) <= 0) {
                        checkbox.checked = false;
                        countInput.disabled = true;
                    }
                });
                
                // Initially disable count inputs
                countInput.disabled = !checkbox.checked;
            });
            
            // Image upload preview
            const imageInput = document.getElementById('room-image');
            const imagePreview = document.getElementById('image-preview');
            
            // Initial placeholder
            imagePreview.innerHTML = '<div class="image-preview-placeholder">Chưa có ảnh phòng</div>';
            
            imageInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        imagePreview.innerHTML = `
                            <img src="${e.target.result}" alt="Ảnh phòng" />
                            <div class="image-preview-remove" id="remove-image">
                                <i class="fas fa-times"></i>
                            </div>
                        `;
                        
                        // Add event listener for remove button
                        document.getElementById('remove-image').addEventListener('click', removeImage);
                    }
                    
                    reader.readAsDataURL(this.files[0]);
                }
            });
            
            function removeImage(e) {
                e.stopPropagation();
                imageInput.value = '';
                imagePreview.innerHTML = '<div class="image-preview-placeholder">Chưa có ảnh phòng</div>';
            }
            
            // Add listener for room-modal close button
            document.querySelector('.modal-close').addEventListener('click', closeModal);
            document.getElementById('cancel-btn').addEventListener('click', closeModal);
            
            // Add room button
            document.getElementById('add-room-btn').addEventListener('click', openAddModal);
            
            // Save room button
            document.getElementById('save-room-btn').addEventListener('click', saveRoom);

            // Export button
            document.getElementById('export-btn').addEventListener('click', exportRoomsData);
            
            // Setup confirm delete modal
            document.getElementById('cancel-delete-btn').addEventListener('click', function() {
                document.getElementById('confirm-delete-modal').style.display = 'none';
            });
            
            document.getElementById('confirm-delete-btn').addEventListener('click', confirmDeleteRoom);
        }

        // Variables for delete confirmation
        let roomToDeleteId = null;
        
        function deleteRoom(roomId) {
            const room = roomsData.find(r => r.id.toString() === roomId.toString());
            if (!room) {
                alert('Không tìm thấy thông tin phòng!');
                return;
            }
            
            // Set the room ID to be deleted
            roomToDeleteId = roomId;
            
            // Display room ID in the confirmation message
            document.getElementById('delete-room-id').textContent = `${room.id} (${room.room_name || ''})`;
            
            // Show confirmation modal
            document.getElementById('confirm-delete-modal').style.display = 'flex';
        }
        
        async function confirmDeleteRoom() {
            if (!roomToDeleteId) return;
            
            try {
                // First, check if the room has IoT devices
                const iotResponse = await fetch(`${ENDPOINTS.IOT}?room_id=${roomToDeleteId}`, {
                    credentials: 'include'
                });
                
                if (iotResponse.ok) {
                    const iotDevices = await iotResponse.json();
                    if (iotDevices && iotDevices.length > 0) {
                        // Room has IoT devices, ask user if they want to delete them first
                        if (confirm(`Phòng này có ${iotDevices.length} thiết bị IoT. Bạn cần xóa thiết bị trước khi xóa phòng. Chuyển đến trang quản lý thiết bị IoT?`)) {
                            window.location.href = 'admin-iot-devices.html';
                        }
                        return;
                    }
                }
                
                // If no IoT devices or check failed, proceed with room deletion
                const response = await fetch(`${ENDPOINTS.ROOMS}/${roomToDeleteId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMessage = errorData.message || errorData.error || 'Không thể xóa phòng. Phòng có thể đang sử dụng hoặc có thiết bị IoT.';
                    throw new Error(errorMessage);
                }
                
                // Hide confirmation modal
                document.getElementById('confirm-delete-modal').style.display = 'none';
                
                // Reload rooms and update display
                await loadRooms();
                generateRoomCards(roomsData);
                
                alert('Đã xóa phòng thành công!');
            } catch (error) {
                console.error('Error deleting room:', error);
                alert(`Lỗi khi xóa phòng: ${error.message}`);
            } finally {
                roomToDeleteId = null;
            }
        }

        async function initializeRoomsPage() {
            try {
                // Load room types
                const roomTypeResponse = await fetch(ENDPOINTS.ROOM_TYPES, {
                    credentials: 'include'
                });
                if (roomTypeResponse.ok) {
                    roomTypes = await roomTypeResponse.json();
                    populateRoomTypeFilter(roomTypes);
                }
                
                // Load rooms
                roomsData = await loadRooms();
                
                // Generate room cards
                generateRoomCards(roomsData);
                
                // Setup search and filter listeners
                setupFiltersAndSearch();
            } catch (error) {
                console.error('Error initializing rooms page:', error);
                document.getElementById('room-grid').innerHTML = `
                    <div class="error-message">
                        <p>${error.message || 'Đã xảy ra lỗi khi tải dữ liệu phòng'}</p>
                        <button class="btn btn-primary" onclick="initializeRoomsPage()">Thử lại</button>
                    </div>
                `;
            }
        }

        async function loadRooms() {
            try {
                const response = await fetch(ENDPOINTS.ROOMS, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to load rooms: ${response.status}`);
                }
                
                roomsData = await response.json();
                return roomsData;
            } catch (error) {
                console.error('Error loading rooms:', error);
                throw error;
            }
        }
        
        function getEquipmentData() {
            let equipment = {};
            
            // Loop through all equipment checkboxes
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                if (checkbox.checked) {
                    const countInput = document.getElementById(`${checkbox.value}-count`);
                    const count = parseInt(countInput.value) || 1;
                    equipment[checkbox.value] = count;
                }
            });
            
            return equipment;
        }
        
        function getIoTDeviceData() {
            let iotDevices = [];
            
            // Loop through all equipment checkboxes
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                if (checkbox.checked) {
                    const equipmentType = checkbox.value;
                    const countInput = document.getElementById(`${equipmentType}-count`);
                    const count = parseInt(countInput.value) || 0;
                    
                    // Skip if count is 0
                    if (count <= 0) return;
                    
                    // Define a friendly name for device type
                    const deviceTypeNames = {
                        'projector': 'Máy chiếu',
                        'computer': 'Máy tính',
                        'air_conditioner': 'Điều hòa',
                        'speaker': 'Loa',
                        'light': 'Đèn',
                        'fan': 'Quạt'
                    };
                    
                    // Create device objects with auto-incrementing names
                    for (let i = 1; i <= count; i++) {
                        iotDevices.push({
                            device_type: equipmentType,
                            device_name: `${deviceTypeNames[equipmentType] || equipmentType} ${i}`
                        });
                    }
                }
            });
            
            return iotDevices;
        }
        
        function populateEquipmentInputs(facilities) {
            // Reset all checkboxes first
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                checkbox.checked = false;
                const countInput = document.getElementById(`${checkbox.value}-count`);
                countInput.value = 0;
                countInput.disabled = true;
            });
            
            if (!facilities) return;
            
            let facilitiesObj = {};
            
            // Parse facilities if it's a string
            if (typeof facilities === 'string') {
                try {
                    facilitiesObj = JSON.parse(facilities);
                } catch (e) {
                    console.error('Error parsing facilities:', e);
                    // If can't parse, split by comma and set value to 1
                    const facilitiesArray = facilities.split(',').map(item => item.trim());
                    facilitiesArray.forEach(item => {
                        facilitiesObj[item] = 1;
                    });
                }
            } else if (typeof facilities === 'object') {
                facilitiesObj = facilities;
            }
            
            // Set checkbox and count for each equipment
            for (const [key, value] of Object.entries(facilitiesObj)) {
                const checkbox = document.querySelector(`input[name="equipment"][value="${key}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                    const countInput = document.getElementById(`${key}-count`);
                    countInput.value = value;
                    countInput.disabled = false;
                }
            }
        }
        
        function populateRoomTypeFilter(types) {
            const typeFilter = document.getElementById('type-filter');
            
            // Clear existing options except the first one
            while (typeFilter.options.length > 1) {
                typeFilter.remove(1);
            }
            
            // Add room type options
            const roomTypeLabels = {
                'classroom': 'Phòng học',
                'meeting': 'Phòng họp',
                'lab': 'Phòng thí nghiệm',
                'computer': 'Phòng máy tính',
                'lecture': 'Giảng đường',
                'study': 'Không gian học tập'
            };
            
            Object.entries(roomTypeLabels).forEach(([value, label]) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                typeFilter.appendChild(option);
            });
        }
        
        function setupFiltersAndSearch() {
            const searchInput = document.querySelector('.search-box input');
            const statusFilter = document.getElementById('status-filter');
            const typeFilter = document.getElementById('type-filter');
            
            // Apply filters on input/change
            searchInput.addEventListener('input', applyFilters);
            statusFilter.addEventListener('change', applyFilters);
            typeFilter.addEventListener('change', applyFilters);
        }

        function applyFilters() {
            const statusValue = document.getElementById('status-filter').value;
            const typeValue = document.getElementById('type-filter').value;
            const searchValue = document.querySelector('.search-box input').value.toLowerCase();
            
            let filteredRooms = [...roomsData];
            
            if (statusValue !== 'all') {
                filteredRooms = filteredRooms.filter(room => room.status === statusValue);
            }
            
            if (typeValue !== 'all') {
                filteredRooms = filteredRooms.filter(room => room.room_type === typeValue);
            }
            
            if (searchValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.room_name?.toLowerCase().includes(searchValue) || 
                    room.id?.toString().toLowerCase().includes(searchValue) || 
                    room.location?.toLowerCase().includes(searchValue)
                );
            }
            
            generateRoomCards(filteredRooms);
        }

        async function saveRoom() {
            const form = document.getElementById('room-form');
            const roomId = form.dataset.roomId;
            const isEditMode = !!roomId;
            
            // Lấy dữ liệu input
            const roomName = document.getElementById('room-name').value.trim();
            const location = document.getElementById('room-location-select').value;
            
            // Validate dữ liệu chính
            if (!roomName) {
                alert('Vui lòng nhập tên phòng!');
                return;
            }
            
            if (!location) {
                alert('Vui lòng chọn vị trí phòng!');
                return;
            }
            
            // Tạo đối tượng dữ liệu để gửi lên server
            const roomData = {
                room_name: roomName,
                location: location,
                capacity: parseInt(document.getElementById('room-capacity').value) || 0,
                room_type: document.getElementById('room-type').value,
                description: document.getElementById('edit-room-description').value,
                status: document.getElementById('room-status').value,
                updated_at: new Date().toISOString()
            };
            
            // Chỉ cập nhật thiết bị nếu đang thêm phòng mới, không phải chỉnh sửa
            if (!isEditMode) {
                // Lấy dữ liệu thiết bị
                const equipment = getEquipmentData();
                const iotDevices = getIoTDeviceData();
                roomData.facilities = equipment;
                roomData.created_at = new Date().toISOString();
            }
            
            try {
                let response;
                let endpoint = roomId ? `${ENDPOINTS.ROOMS}/${roomId}` : ENDPOINTS.ROOMS;
                
                // Gửi dữ liệu lên server
                response = await fetch(endpoint, {
                    method: roomId ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(roomData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Không thể lưu thông tin phòng');
                }
                
                const savedRoomData = await response.json();
                // Lấy ID phòng từ dữ liệu trả về HOẶC từ roomId hiện tại (nếu đang cập nhật)
                let savedRoomId;
                
                // Xử lý các cấu trúc phản hồi khác nhau từ API
                if (typeof savedRoomData === 'object') {
                    if (savedRoomData.id) {
                        savedRoomId = savedRoomData.id;
                    } else if (savedRoomData.room && savedRoomData.room.id) {
                        savedRoomId = savedRoomData.room.id;
                    } else if (savedRoomData.data && savedRoomData.data.id) {
                        savedRoomId = savedRoomData.data.id;
                    }
                }
                
                // Nếu không thể lấy ID từ phản hồi, sử dụng ID hiện tại (nếu có)
                if (!savedRoomId && roomId) {
                    savedRoomId = roomId;
                }
                
                // Kiểm tra nếu không có ID phòng
                if (!savedRoomId) {
                    console.error('Không thể xác định ID phòng');
                    alert('Phòng đã được lưu nhưng không thể xác định ID phòng. Vui lòng thử lại sau.');
                    
                    // Tải lại danh sách phòng và đóng modal
                    await loadRooms();
                    generateRoomCards(roomsData);
                    closeModal();
                    return;
                }
                
                // Chỉ xử lý thiết bị IoT khi thêm phòng mới
                if (!isEditMode) {
                    // Lấy dữ liệu thiết bị
                    const iotDevices = getIoTDeviceData();
                    
                    // Thêm thiết bị IoT nếu có
                    if (iotDevices.length > 0) {
                        await addIoTDevicesToRoom(savedRoomId, iotDevices);
                    }
                }
                
                // Xử lý upload ảnh nếu có file được chọn
                const imageInput = document.getElementById('room-image');
                if (imageInput.files && imageInput.files[0]) {
                    const formData = new FormData();
                    formData.append('image', imageInput.files[0]);
                    
                    const imageResponse = await fetch(`${ENDPOINTS.ROOMS}/${savedRoomId}/image`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    
                    if (!imageResponse.ok) {
                        console.warn('Không thể tải lên ảnh phòng, nhưng thông tin phòng đã được lưu.');
                    }
                }
                
                // Xử lý xóa ảnh nếu người dùng đã chọn xóa
                if (form.dataset.removeImage === 'true' && roomId) {
                    const deleteImageResponse = await fetch(`${ENDPOINTS.ROOMS}/${roomId}/image`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    
                    if (!deleteImageResponse.ok) {
                        console.warn('Không thể xóa ảnh phòng, nhưng thông tin phòng đã được lưu.');
                    }
                }
                
                // Tải lại danh sách phòng và đóng modal
                await loadRooms();
                generateRoomCards(roomsData);
                closeModal();
                
                alert(roomId ? 'Phòng đã được cập nhật thành công!' : 'Đã thêm phòng mới thành công!');
            } catch (error) {
                console.error('Error saving room:', error);
                alert(`Lỗi khi lưu thông tin phòng: ${error.message}`);
            }
        }
        
        function openAddModal() {
            document.getElementById('room-form').dataset.roomId = '';
            document.getElementById('room-modal-title').textContent = 'Thêm phòng mới';
            document.getElementById('room-form').reset();
            document.getElementById('room-status').value = 'available';
            document.getElementById('room-type').value = 'classroom';
            
            // Reset equipment
            document.querySelectorAll('input[name="equipment"]').forEach(checkbox => {
                checkbox.checked = false;
                document.getElementById(`${checkbox.value}-count`).disabled = true;
                document.getElementById(`${checkbox.value}-count`).value = 0;
            });
            
            // Reset image preview
            const imagePreview = document.getElementById('image-preview');
            imagePreview.innerHTML = '<div class="image-preview-placeholder">Chưa có ảnh phòng</div>';
            
            // Show modal
            document.getElementById('room-modal').style.display = 'flex';
        }
        
        function displayEquipment(facilities, containerId = 'equipment-display') {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            
            if (!facilities || (typeof facilities === 'object' && Object.keys(facilities).length === 0)) {
                container.innerHTML = '<div class="empty-equipment-message">Không có thông tin về thiết bị</div>';
                return;
            }
            
            let equipmentData = {};
            
            // Parse facilities if it's a string
            if (typeof facilities === 'string') {
                try {
                    equipmentData = JSON.parse(facilities);
                } catch (e) {
                    // If can't parse, split by comma
                    const items = facilities.split(',').map(item => item.trim());
                    items.forEach(item => {
                        equipmentData[item] = 1;
                    });
                }
            } else if (typeof facilities === 'object') {
                equipmentData = facilities;
            }
            
            // Equipment type names
            const equipmentTypeNames = {
                'projector': 'Máy chiếu',
                'computer': 'Máy tính',
                'air_conditioner': 'Điều hòa',
                'speaker': 'Loa',
                'light': 'Đèn',
                'fan': 'Quạt'
            };
            
            // Get IoT devices for this room
            const roomId = document.getElementById('room-form').dataset.roomId;
            
            // Display equipment items
            for (const [type, count] of Object.entries(equipmentData)) {
                if (count > 0) {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'equipment-item-display';
                    
                    // Use friendly name if available
                    const typeName = equipmentTypeNames[type] || type;
                    
                    itemElement.textContent = `${typeName} (${count})`;
                    
                    // Add IoT badge if this has IoT enabled equipment
                    // Note: in a production environment, you'd check if IoT devices exist
                    if (roomId) {
                        const iotBadge = document.createElement('span');
                        iotBadge.className = 'equipment-iot-badge';
                        iotBadge.textContent = 'IoT';
                        itemElement.appendChild(iotBadge);
                    }
                    
                    container.appendChild(itemElement);
                }
            }
        }
        
        function openEditModal(room) {
            document.getElementById('room-form').dataset.roomId = room.id;
            document.getElementById('room-modal-title').textContent = 'Chỉnh sửa phòng';
            document.getElementById('room-name').value = room.room_name || '';
            document.getElementById('room-id').value = room.id || '';
            document.getElementById('room-location-select').value = room.location || '';
            document.getElementById('room-capacity').value = room.capacity || '';
            document.getElementById('room-type').value = room.room_type || 'classroom';
            document.getElementById('room-status').value = room.status || 'available';
            document.getElementById('edit-room-description').value = room.description || '';
            
            // Reset image preview
            const imagePreview = document.getElementById('image-preview');
            imagePreview.innerHTML = '<div class="image-preview-placeholder">Chọn hình ảnh để thay đổi</div>';
            
            // Thiết lập hiển thị thiết bị chỉ để xem
            const equipmentOptions = document.querySelector('.equipment-options');
            const originalEquipmentOptions = equipmentOptions.innerHTML;
            
            // Lưu lại HTML gốc để khôi phục khi đóng modal
            document.getElementById('room-form').dataset.originalEquipment = originalEquipmentOptions;
            
            // Hiển thị thiết bị dạng chỉ đọc
            let readOnlyEquipment = '<div class="equipment-display">';
            
            if (!room.facilities || (typeof room.facilities === 'object' && Object.keys(room.facilities).length === 0)) {
                readOnlyEquipment += '<div class="empty-equipment-message">Không có thông tin về thiết bị</div>';
            } else {
                let facilitiesObj = {};
                
                // Parse facilities if it's a string
                if (typeof room.facilities === 'string') {
                    try {
                        facilitiesObj = JSON.parse(room.facilities);
                    } catch (e) {
                        const facilitiesArray = room.facilities.split(',').map(item => item.trim());
                        facilitiesArray.forEach(item => {
                            facilitiesObj[item] = 1;
                        });
                    }
                } else if (typeof room.facilities === 'object') {
                    facilitiesObj = room.facilities;
                }
                
                // Equipment type names
                const equipmentTypeNames = {
                    'projector': 'Máy chiếu',
                    'computer': 'Máy tính',
                    'air_conditioner': 'Điều hòa',
                    'speaker': 'Loa',
                    'light': 'Đèn',
                    'fan': 'Quạt'
                };
                
                // Display equipment items
                for (const [type, count] of Object.entries(facilitiesObj)) {

        function generateRoomCards(rooms) {
            const roomGrid = document.getElementById('room-grid');
            
            if (!rooms || rooms.length === 0) {
                roomGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>Không tìm thấy phòng nào. Thêm phòng mới hoặc thay đổi bộ lọc tìm kiếm.</p>
                    </div>
                `;
                return;
            }
            
            roomGrid.innerHTML = '';
            
            // Room type labels for display
            const roomTypeLabels = {
                'classroom': 'Phòng học',
                'meeting': 'Phòng họp',
                'lab': 'Phòng thí nghiệm',
                'computer': 'Phòng máy tính',
                'lecture': 'Giảng đường',
                'study': 'Không gian học tập'
            };
            
            // Generate room cards
            rooms.forEach(room => {
                // Create room status element
                let statusClass = '';
                let statusText = '';
                
                switch (room.status) {
                    case 'available':
                        statusClass = 'status-available';
                        statusText = 'Trống';
                        break;
                    case 'occupied':
                        statusClass = 'status-occupied';
                        statusText = 'Đang sử dụng';
                        break;
                    case 'maintenance':
                        statusClass = 'status-maintenance';
                        statusText = 'Bảo trì';
                        break;
                    default:
                        statusClass = 'status-available';
                        statusText = 'Trống';
                }
                
                // Parse facilities if it's a string
                let facilitiesDisplay = '';
                if (room.facilities) {
                    let facilitiesObj = {};
                    
                    if (typeof room.facilities === 'string') {
                        try {
                            // Try to parse JSON string
                            facilitiesObj = JSON.parse(room.facilities);
                        } catch (e) {
                            console.log('Error parsing facilities:', e);
                            // Check if it looks like JSON but failed to parse
                            if (room.facilities.includes('{') && room.facilities.includes('}')) {
                                facilitiesDisplay = 'Không có';
                            } else {
                                // If not JSON, split by comma
                                const facilitiesArray = room.facilities.split(',').map(item => item.trim());
                                facilitiesArray.forEach(item => {
                                    if (item) facilitiesObj[item] = 1;
                                });
                            }
                        }
                    } else if (typeof room.facilities === 'object') {
                        facilitiesObj = room.facilities;
                    }
                    
                    // Only create display if we don't have an error message already
                    if (!facilitiesDisplay) {
                        // Format facilities for display
                        const facilityLabels = {
                            'projector': 'Máy chiếu',
                            'computer': 'Máy tính',
                            'air_conditioner': 'Điều hòa',
                            'speaker': 'Loa',
                            'fan': 'Quạt',
                            'light': 'Đèn'
                        };
                        
                        if (Object.keys(facilitiesObj).length > 0) {
                            facilitiesDisplay = Object.entries(facilitiesObj)
                                .map(([key, value]) => {
                                    return `${facilityLabels[key] || key} (${value})`;
                                })
                                .join(', ');
                        } else {
                            facilitiesDisplay = 'Không có';
                        }
                    }
                }
                
                // Create card HTML
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div class="room-info">
                        <div class="room-status ${statusClass}">${statusText}</div>
                        <div class="room-name">
                            ${room.room_name}
                            <span class="room-code">${room.id}</span>
                        </div>
                        <div class="room-details">
                            <div class="room-detail">
                                <i class="fas fa-map-marker-alt"></i>
                                ${room.location}
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-users"></i>
                                Sức chứa: ${room.capacity || 'Không xác định'} chỗ
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-tasks"></i>
                                Loại phòng: ${roomTypeLabels[room.room_type] || room.room_type || 'Không xác định'}
                            </div>
                            <div class="room-detail">
                                <i class="fas fa-laptop"></i>
                                Thiết bị: ${facilitiesDisplay || 'Không có'}
                            </div>
                        </div>
                        <div class="room-actions">
                            <span class="action-icon view-btn" title="Xem chi tiết">
                                <i class="fas fa-eye"></i>
                            </span>
                            <span class="action-icon edit-btn" title="Chỉnh sửa" data-room-id="${room.id}">
                                <i class="fas fa-edit"></i>
                            </span>
                            <span class="action-icon delete-btn" title="Xóa" data-room-id="${room.id}">
                                <i class="fas fa-trash"></i>
                            </span>
                            <span class="action-icon toggle-status-btn" title="Đổi trạng thái" data-room-id="${room.id}">
                                <i class="fas fa-power-off"></i>
                            </span>
                        </div>
                    </div>
                `;
                
                // Add event listeners to action buttons
                const editBtn = card.querySelector('.edit-btn');
                editBtn.addEventListener('click', () => openEditModal(room));
                
                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', () => showDeleteConfirmation(room.id, room.room_name));
                
                const viewBtn = card.querySelector('.view-btn');
                viewBtn.addEventListener('click', () => viewRoomDetails(room.id));
                
                const toggleStatusBtn = card.querySelector('.toggle-status-btn');
                toggleStatusBtn.addEventListener('click', () => toggleRoomStatus(room.id));
                
                // Add card to grid
                roomGrid.appendChild(card);
            });
        }
        
        function exportRoomsData() {
            // Get currently filtered rooms
            const statusValue = document.getElementById('status-filter').value;
            const typeValue = document.getElementById('type-filter').value;
            const searchValue = document.querySelector('.search-box input').value.toLowerCase();
            
            let filteredRooms = [...roomsData];
            
            if (statusValue !== 'all') {
                filteredRooms = filteredRooms.filter(room => room.status === statusValue);
            }
            
            if (typeValue !== 'all') {
                filteredRooms = filteredRooms.filter(room => room.room_type === typeValue);
            }
            
            if (searchValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.room_name?.toLowerCase().includes(searchValue) || 
                    room.id?.toString().toLowerCase().includes(searchValue) || 
                    room.location?.toLowerCase().includes(searchValue)
                );
            }
            
            // Generate CSV content
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Headers
            csvContent += "ID,Tên phòng,Loại phòng,Vị trí,Sức chứa,Trạng thái,Thiết bị\n";
            
            // Data rows
            filteredRooms.forEach(room => {
                const roomTypeLabel = roomTypes.find(t => t.value === room.room_type)?.label || room.room_type;
                let statusText = '';
                
                switch(room.status) {
                    case 'available': statusText = 'Còn trống'; break;
                    case 'occupied': statusText = 'Đang sử dụng'; break;
                    case 'maintenance': statusText = 'Bảo trì'; break;
                    default: statusText = room.status;
                }
                
                // Format facilities for CSV
                let facilitiesText = '';
                if (room.facilities) {
                    try {
                        // Try to parse if it's a string
                        const facilities = typeof room.facilities === 'string' 
                            ? JSON.parse(room.facilities) 
                            : room.facilities;
                        
                        // Convert to a simple text format for CSV
                        const facilityLabels = {
                            'projector': 'Máy chiếu',
                            'computer': 'Máy tính',
                            'air_conditioner': 'Điều hòa',
                            'speaker': 'Loa',
                            'fan': 'Quạt',
                            'light': 'Đèn'
                        };
                        
                        facilitiesText = Object.entries(facilities)
                            .map(([key, value]) => `${facilityLabels[key] || key}:${value}`)
                            .join('; ');
                    } catch (e) {
                        console.log('Error parsing facilities for CSV:', e);
                        facilitiesText = 'Lỗi định dạng';
                    }
                }
                
                csvContent += `${room.id},"${room.room_name}","${roomTypeLabel}","${room.location}",${room.capacity},"${statusText}","${facilitiesText}"\n`;
            });
            
            // Create download link
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `danh-sach-phong-${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            
            // Trigger download
            link.click();
            document.body.removeChild(link);
        }

        async function toggleRoomStatus(roomId) {
            try {
                console.log(`Toggling room status for room ID: ${roomId}`);
                
                const room = roomsData.find(r => r.id.toString() === roomId.toString());
                if (!room) {
                    throw new Error('Không tìm thấy thông tin phòng!');
                }
                
                // Xác định trạng thái mới (đối lập với trạng thái hiện tại)
                let newStatus;
                if (room.status === 'available') {
                    newStatus = 'maintenance';
                    if (!confirm('Bạn có chắc chắn muốn đóng phòng này (đặt sang trạng thái bảo trì) không?')) {
                        return;
                    }
                } else {
                    newStatus = 'available';
                    if (!confirm('Bạn có chắc chắn muốn mở lại phòng này (đặt sang trạng thái có sẵn) không?')) {
                        return;
                    }
                }
                
                // Create a simplified update payload with just the necessary fields
                // This avoids sending the entire room object with potentially pre-stringified facilities
                const updatedRoom = {
                    id: room.id,
                    room_name: room.room_name,
                    location: room.location,
                    capacity: room.capacity,
                    room_type: room.room_type,
                    description: room.description,
                    status: newStatus,
                    // Don't include facilities to avoid double-encoding
                    updated_at: new Date().toISOString()
                };
                
                console.log(`Sending update request with data:`, JSON.stringify(updatedRoom));
                
                const response = await fetch(`${ENDPOINTS.ROOMS}/${roomId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(updatedRoom)
                });
                
                if (!response.ok) {
                    // Check response content type for proper error handling
                    const contentType = response.headers.get('Content-Type');
                    let errorMessage = '';
                    
                    if (contentType && contentType.includes('application/json')) {
                        try {
                            const errorData = await response.json();
                            errorMessage = errorData.message || errorData.error || `Lỗi: ${response.status} ${response.statusText}`;
                        } catch (parseError) {
                            console.error('Error parsing error response:', parseError);
                            // Try to get the text response if JSON parsing fails
                            const textResponse = await response.text();
                            console.log('Response text:', textResponse);
                            errorMessage = `Lỗi: ${response.status} ${response.statusText}`;
                        }
                    } else {
                        // If not JSON, get text response
                        const textResponse = await response.text();
                        console.warn('Non-JSON error response:', textResponse);
                        errorMessage = `Lỗi: ${response.status} ${response.statusText}`;
                    }
                    
                    throw new Error(errorMessage || 'Không thể cập nhật trạng thái phòng');
                }
                
                // Handle successful response
                let responseData;
                try {
                    // Validate content type and parse JSON
                    const contentType = response.headers.get('Content-Type');
                    if (!contentType || !contentType.includes('application/json')) {
                        console.warn(`Expected JSON response but got ${contentType}. Attempting to parse anyway.`);
                    }
                    responseData = await response.json();
                } catch (parseError) {
                    console.error('Error parsing success response:', parseError);
                    // Success but couldn't parse response - still continue
                    console.log('Response text:', await response.text());
                }
                
                // Tải lại danh sách phòng
                await loadRooms();
                generateRoomCards(roomsData);
                
                alert(newStatus === 'maintenance' ? 'Đã đóng phòng thành công!' : 'Đã mở lại phòng thành công!');
            } catch (error) {
                console.error('Error toggling room status:', error);
                alert(`Lỗi: ${error.message}`);
            }
        }
