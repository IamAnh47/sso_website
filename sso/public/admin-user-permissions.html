<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý phân quyền - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .menu-item.logo-item {
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            max-width: 100%;
            object-fit: contain;
        }

        .menu-item.active {
            background-color: #28a745;
            color: white;
        }
        
        .permissions-container {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .role-tabs {
            display: flex;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }
        
        .role-tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }
        
        .role-tab.active {
            border-bottom-color: #28a745;
            color: #28a745;
        }
        
        .permission-group {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        
        .permission-group-title {
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .group-toggle {
            cursor: pointer;
            color: #6c757d;
        }
        
        .permission-items {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .permission-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        
        .permission-checkbox {
            margin-right: 10px;
        }
        
        .permission-info {
            display: flex;
            flex-direction: column;
        }
        
        .permission-name {
            font-weight: 500;
        }
        
        .permission-desc {
            font-size: 12px;
            color: #6c757d;
        }
        
        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .permission-items {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="admin-dashboard">
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item logo-item">
                <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
            </div>
            <div class="menu-item" id="overview-menu-item" data-title="Trang chủ">
                <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="menu-item" id="room-management-menu-item" data-title="Quản lý phòng">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="menu-item active" id="user-management-menu-item" data-title="Quản lý người dùng">
                <i class="fas fa-users"></i>
            </div>
            <div class="menu-item" id="booking-management-menu-item" data-title="Quản lý đặt phòng">
                <i class="fas fa-calendar-check"></i>
            </div>
            <div class="menu-item" id="notifications-menu-item" data-title="Thông báo">
                <i class="fas fa-bell"></i>
            </div>
            <div class="menu-item" id="statistics-menu-item" data-title="Thống kê">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Quản lý phân quyền</h1>
            <div class="user-controls">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        
        <div class="content-container">
            <div class="breadcrumb">
                <a href="admin-overview.html">Trang chủ</a> / 
                <a href="admin-user-management.html">Quản lý người dùng</a> / 
                <span>Phân quyền</span>
            </div>
            
            <div class="permissions-container">
                <h2 class="section-title">Cấu hình quyền hạn theo vai trò</h2>
                
                <div class="role-tabs">
                    <div class="role-tab active" data-role="admin">Quản trị viên</div>
                    <div class="role-tab" data-role="staff">Nhân viên</div>
                    <div class="role-tab" data-role="student">Sinh viên</div>
                </div>
                
                <div id="permissions-list">
                    <!-- Permission groups will be inserted here -->
                </div>
                
                <div class="actions-bar">
                    <button class="btn btn-outline" id="reset-btn">
                        <i class="fas fa-undo"></i> Đặt lại mặc định
                    </button>
                    <button class="btn btn-primary" id="save-permissions-btn">
                        <i class="fas fa-save"></i> Lưu thay đổi
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = '/api';
        const ENDPOINTS = {
            ROLES: `${API_BASE_URL}/roles`,
            PERMISSIONS: `${API_BASE_URL}/permissions`,
            ROLE_PERMISSIONS: `${API_BASE_URL}/roles/:roleId/permissions`
        };
        
        let rolesData = [];
        let permissionsData = [];
        let currentRole = 'admin';
        
        document.addEventListener('DOMContentLoaded', function() {
            setupNavigation();
            initializePermissionsPage();
        });
        
        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        function createAuthHeaders() {
            const token = getAuthToken();
            return {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };
        }
        
        function setupNavigation() {
            document.getElementById('overview-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-overview.html';
            });
            
            document.getElementById('room-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-room-management.html';
            });
            
            document.getElementById('user-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-user-management.html';
            });
            document.getElementById('booking-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-booking-management.html';
            });
            document.getElementById('statistics-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-statistics.html';
            });
            
            document.getElementById('notifications-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-notifications.html';
            });
            
            document.getElementById('logout-btn').addEventListener('click', function() {
                logout();
            });
            
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const role = this.getAttribute('data-role');
                    switchRole(role);
                });
            });
            
            document.getElementById('save-permissions-btn').addEventListener('click', savePermissions);
            document.getElementById('reset-btn').addEventListener('click', resetToDefault);
        }
        
        async function initializePermissionsPage() {
            try {
                await Promise.all([
                    loadRoles(),
                    loadPermissions()
                ]);
                
                await renderPermissionsForRole(currentRole);
            } catch (error) {
                console.error('Error initializing permissions page:', error);
                alert('Đã xảy ra lỗi khi tải dữ liệu phân quyền. Vui lòng thử lại sau.');
            }
        }
        
        async function loadRoles() {
            try {
                const response = await fetch(ENDPOINTS.ROLES, {
                    headers: createAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to fetch roles');
                
                rolesData = await response.json();
            } catch (error) {
                console.error('Error loading roles:', error);
                throw error;
            }
        }
        
        async function loadPermissions() {
            try {
                const response = await fetch(ENDPOINTS.PERMISSIONS, {
                    headers: createAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to fetch permissions');
                
                permissionsData = await response.json();
            } catch (error) {
                console.error('Error loading permissions:', error);
                throw error;
            }
        }
        
        async function loadRolePermissions(roleId) {
            try {
                const response = await fetch(ENDPOINTS.ROLE_PERMISSIONS.replace(':roleId', roleId), {
                    headers: createAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to fetch role permissions');
                
                return await response.json();
            } catch (error) {
                console.error(`Error loading permissions for role ${roleId}:`, error);
                throw error;
            }
        }
        
        function switchRole(role) {
            document.querySelectorAll('.role-tab').forEach(tab => {
                if (tab.getAttribute('data-role') === role) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            currentRole = role;
            renderPermissionsForRole(role);
        }
        
        async function renderPermissionsForRole(role) {
            try {
                const roleObj = rolesData.find(r => r.code === role);
                if (!roleObj) throw new Error(`Role "${role}" not found`);
                
                const rolePermissions = await loadRolePermissions(roleObj.id);
                
                const grantedPermissionIds = new Set(rolePermissions.map(p => p.id));
                
                const permissionsByCategory = {};
                
                permissionsData.forEach(permission => {
                    const category = permission.category || 'Khác';
                    
                    if (!permissionsByCategory[category]) {
                        permissionsByCategory[category] = [];
                    }
                    
                    permissionsByCategory[category].push({
                        ...permission,
                        granted: grantedPermissionIds.has(permission.id)
                    });
                });
                
                const permissionsList = document.getElementById('permissions-list');
                permissionsList.innerHTML = '';
                
                Object.entries(permissionsByCategory).forEach(([category, permissions]) => {
                    const group = document.createElement('div');
                    group.className = 'permission-group';
                    
                    const groupTitle = document.createElement('div');
                    groupTitle.className = 'permission-group-title';
                    
                    const titleText = document.createElement('span');
                    titleText.textContent = category;
                    
                    const groupToggle = document.createElement('span');
                    groupToggle.className = 'group-toggle';
                    groupToggle.innerHTML = '<i class="fas fa-check-square"></i> Chọn tất cả';
                    
                    groupToggle.addEventListener('click', function() {
                        const checkboxes = group.querySelectorAll('input[type="checkbox"]');
                        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                        
                        checkboxes.forEach(checkbox => {
                            checkbox.checked = !allChecked;
                        });
                    });
                    
                    groupTitle.appendChild(titleText);
                    groupTitle.appendChild(groupToggle);
                    
                    const permissionItems = document.createElement('div');
                    permissionItems.className = 'permission-items';
                    
                    permissions.forEach(permission => {
                        const item = document.createElement('div');
                        item.className = 'permission-item';
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.className = 'permission-checkbox';
                        checkbox.id = `perm-${permission.id}`;
                        checkbox.checked = permission.granted;
                        checkbox.dataset.permissionId = permission.id;
                        
                        const label = document.createElement('label');
                        label.className = 'permission-info';
                        label.setAttribute('for', `perm-${permission.id}`);
                        
                        const permName = document.createElement('span');
                        permName.className = 'permission-name';
                        permName.textContent = permission.name;
                        
                        const permDesc = document.createElement('span');
                        permDesc.className = 'permission-desc';
                        permDesc.textContent = permission.description || 'Không có mô tả';
                        
                        label.appendChild(permName);
                        label.appendChild(permDesc);
                        
                        item.appendChild(checkbox);
                        item.appendChild(label);
                        
                        permissionItems.appendChild(item);
                    });
                    
                    group.appendChild(groupTitle);
                    group.appendChild(permissionItems);
                    
                    permissionsList.appendChild(group);
                });
                
                if (Object.keys(permissionsByCategory).length === 0) {
                    permissionsList.innerHTML = '<div class="alert">Không có quyền nào để cấu hình</div>';
                }
                
            } catch (error) {
                console.error('Error rendering permissions:', error);
                document.getElementById('permissions-list').innerHTML = 
                    '<div class="alert alert-danger">Đã xảy ra lỗi khi tải quyền hạn. Vui lòng thử lại sau.</div>';
            }
        }
        
        async function savePermissions() {
            try {
                const roleObj = rolesData.find(r => r.code === currentRole);
                if (!roleObj) throw new Error(`Role "${currentRole}" not found`);
                
                const checkboxes = document.querySelectorAll('.permission-checkbox');
                const grantedPermissionIds = Array.from(checkboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.dataset.permissionId);
                
                const response = await fetch(ENDPOINTS.ROLE_PERMISSIONS.replace(':roleId', roleObj.id), {
                    method: 'PUT',
                    headers: createAuthHeaders(),
                    body: JSON.stringify({ permission_ids: grantedPermissionIds })
                });
                
                if (!response.ok) throw new Error('Failed to update permissions');
                
                alert('Phân quyền đã được cập nhật thành công!');
            } catch (error) {
                console.error('Error saving permissions:', error);
                alert(`Lỗi khi lưu phân quyền: ${error.message}`);
            }
        }
        
        async function resetToDefault() {
            if (confirm(`Bạn có chắc chắn muốn đặt lại quyền mặc định cho vai trò "${currentRole}"?`)) {
                try {
                    const roleObj = rolesData.find(r => r.code === currentRole);
                    if (!roleObj) throw new Error(`Role "${currentRole}" not found`);
                    
                    const response = await fetch(ENDPOINTS.ROLE_PERMISSIONS.replace(':roleId', roleObj.id) + '/reset', {
                        method: 'POST',
                        headers: createAuthHeaders()
                    });
                    
                    if (!response.ok) throw new Error('Failed to reset permissions');
                    
                    await renderPermissionsForRole(currentRole);
                    
                    alert('Đã đặt lại quyền mặc định!');
                } catch (error) {
                    console.error('Error resetting permissions:', error);
                    alert(`Lỗi khi đặt lại quyền mặc định: ${error.message}`);
                }
            }
        }
    </script>
</body>
</html>
