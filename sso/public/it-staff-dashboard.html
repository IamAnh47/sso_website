<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Staff Dashboard | Smart Study Space</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/auth.js" defer></script>
    <style>
        .dashboard-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .stat-card .icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 24px;
            color: white;
        }
        
        .stat-card .blue {
            background-color: #007bff;
        }
        
        .stat-card .green {
            background-color: #28a745;
        }
        
        .stat-card .orange {
            background-color: #fd7e14;
        }
        
        .stat-card h3 {
            font-size: 24px;
            margin: 10px 0 5px;
        }
        
        .stat-card p {
            color: #6c757d;
            margin: 0;
        }
        
        .menu-item.logo-item {
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            max-width: 100%;
            object-fit: contain;
        }

        .menu-item.active {
            background-color: #28a745;
            color: white;
        }

        .table-container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .table-container h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        .data-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-success {
            background-color: #d4edda;
            color: #28a745;
        }

        .status-warning {
            background-color: #fff3cd;
            color: #ffc107;
        }
    </style>
</head>
<body class="admin-dashboard">
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item logo-item">
                <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
            </div>
            <div class="menu-item active" id="dashboard-menu-item" data-title="Dashboard">
                <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="menu-item" id="rooms-menu-item" data-title="Quản lý phòng">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="menu-item" id="devices-menu-item" data-title="Thiết bị IoT">
                <i class="fas fa-microchip"></i>
            </div>
            <div class="menu-item" id="profile-menu-item" data-title="Thông tin cá nhân">
                <i class="fas fa-user"></i>
            </div>
            <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
  
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">IT Staff Dashboard</h1>
            <div class="user-controls">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        
        <div class="content-container">
            <div class="stats-container">
                <div class="stat-card">
                    <div class="icon blue">
                        <i class="fas fa-door-open"></i>
                    </div>
                    <p>Tổng số phòng</p>
                    <h3 id="totalRooms">Loading...</h3>
                </div>
                <div class="stat-card">
                    <div class="icon green">
                        <i class="fas fa-microchip"></i>
                    </div>
                    <p>Thiết bị IoT</p>
                    <h3 id="totalDevices">Loading...</h3>
                </div>
                <div class="stat-card">
                    <div class="icon orange">
                        <i class="fas fa-signal"></i>
                    </div>
                    <p>Trạng thái</p>
                    <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                        <div>
                            <h5 style="margin: 0; color: #28a745;">Bật</h5>
                            <h3 id="onlineDevices" style="margin: 5px 0;">0</h3>
                        </div>
                        <div>
                            <h5 style="margin: 0; color: #dc3545;">Tắt</h5>
                            <h3 id="offlineDevices" style="margin: 5px 0;">0</h3>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="table-container">
                <h3><i class="fas fa-history"></i> Hoạt động gần đây</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Thiết bị</th>
                            <th>Phòng</th>
                            <th>Tòa</th>
                            <th>Hành động</th>
                            <th>Thời gian</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="recentActivities">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
  
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Setup navigation
            document.getElementById('dashboard-menu-item').addEventListener('click', function() {
                // Already on dashboard page
            });
            
            document.getElementById('rooms-menu-item').addEventListener('click', function() {
                window.location.href = 'it-staff-room-management.html';
            });
            
            document.getElementById('devices-menu-item').addEventListener('click', function() {
                window.location.href = 'it-staff-iot-devices.html';
            });
            
            document.getElementById('profile-menu-item').addEventListener('click', function() {
                window.location.href = 'it-staff-profile.html';
            });
            
            document.getElementById('logout-btn').addEventListener('click', function() {
                fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/index.html';
                    }
                })
                .catch(error => {
                    console.error('Logout error:', error);
                });
            });
            
            // Verify user authentication and role
            fetch('/api/auth/verify')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Authentication failed');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.user.role !== 'it_staff') {
                        window.location.href = '/index.html';
                    }
                    
                    // Load dashboard data
                    loadDashboardData();
                })
                .catch(error => {
                    console.error('Auth error:', error);
                    window.location.href = '/index.html';
                });
            
            function loadDashboardData() {
                // Load room count
                fetch('/api/rooms/count')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        document.getElementById('totalRooms').textContent = data.count || 0;
                    })
                    .catch(error => {
                        document.getElementById('totalRooms').textContent = 'Error';
                    });
                
                // Load device count
                fetch('/api/iot/devices/count')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        document.getElementById('totalDevices').textContent = data.count || 0;
                        document.getElementById('onlineDevices').textContent = data.online || 0;
                        document.getElementById('offlineDevices').textContent = data.offline || 0;
                    })
                    .catch(error => {
                        document.getElementById('totalDevices').textContent = 'Error';
                    });
                
                // Load recent activities
                fetch('/api/iot/devices/activities')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        const activitiesContainer = document.getElementById('recentActivities');
                        activitiesContainer.innerHTML = '';
                        
                        if (!data || !Array.isArray(data) || data.length === 0) {
                            const row = document.createElement('tr');
                            row.innerHTML = '<td colspan="6" class="text-center">Không có hoạt động gần đây</td>';
                            activitiesContainer.appendChild(row);
                            return;
                        }
                        
                        data.forEach(activity => {
                            const row = document.createElement('tr');
                            
                            row.innerHTML = `
                                <td>${activity.device_name || 'Không xác định'}</td>
                                <td>${activity.room_name || 'Không xác định'}</td>
                                <td>${activity.location || 'Không xác định'}</td>
                                <td>${translateAction(activity.action) || 'Không có hành động'}</td>
                                <td>${new Date(activity.timestamp).toLocaleString()}</td>
                                <td>
                                    <span class="status-badge status-${activity.status === 'success' ? 'success' : 'warning'}">
                                        ${activity.status === 'success' ? 'Thành công' : 'Cảnh báo'}
                                    </span>
                                </td>
                            `;
                            
                            activitiesContainer.appendChild(row);
                        });
                    })
                    .catch(error => {
                        const activitiesContainer = document.getElementById('recentActivities');
                        activitiesContainer.innerHTML = '<tr><td colspan="6" class="text-center">Lỗi khi tải hoạt động gần đây</td></tr>';
                    });
            }
            
            // Function to translate action names to Vietnamese
            function translateAction(action) {
                const actionMap = {
                    'turned on': 'Đã bật',
                    'turned off': 'Đã tắt',
                    'maintenance': 'Bảo trì',
                    'reset': 'Khởi động lại',
                    'updated': 'Cập nhật',
                    'configured': 'Cấu hình',
                    'connected': 'Đã kết nối',
                    'disconnected': 'Mất kết nối',
                    'error': 'Lỗi',
                    'warning': 'Cảnh báo',
                    'entered maintenance mode': 'Đã vào chế độ bảo trì',
                    'exited maintenance mode': 'Đã thoát chế độ bảo trì'
                };
                
                return actionMap[action] || action;
            }
        });
    </script>
</body>
</html>
