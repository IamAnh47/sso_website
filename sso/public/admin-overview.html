<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Overview Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/auth.js" defer></script>
    <style>
        .dashboard-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .stat-card .icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 24px;
            color: white;
        }
        
        .stat-card .blue {
            background-color: #007bff;
        }
        
        .stat-card .green {
            background-color: #28a745;
        }
        
        .stat-card .orange {
            background-color: #fd7e14;
        }
        
        .stat-card .purple {
            background-color: #6f42c1;
        }
        
        .stat-card h3 {
            font-size: 24px;
            margin: 10px 0 5px;
        }
        
        .stat-card p {
            color: #6c757d;
            margin: 0;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .recent-bookings {
            margin-top: 20px;
        }
        
        .recent-booking-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        
        .recent-booking-item:last-child {
            border-bottom: none;
        }
        
        .booking-user {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }
        
        .booking-details {
            flex: 1;
        }
        
        .booking-details h4 {
            margin: 0 0 5px;
            font-size: 16px;
        }
        
        .booking-details p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;
        }
        
        .booking-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-active {
            background-color: #28a745;
            color: #FFFFFF;
        }
        .menu-item.active {
            background-color: #28a745;
            color: white;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        @media (max-width: 992px) {
            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 576px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
        }

        /* Add this CSS to match the new sidebar format */
        .menu-item.logo-item {
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            max-width: 100%;
            object-fit: contain;
        }

        .menu-item.active {
            background-color: #28a745;
            color: white;
        }

        .card {
            margin-bottom: 15px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 18px;
            color: #6c757d;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="admin-dashboard">
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item logo-item">
                <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
            </div>
            <div class="menu-item active" id="overview-menu-item" data-title="Trang chủ">
                <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="menu-item" id="room-management-menu-item" data-title="Quản lý phòng">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="menu-item" id="user-management-menu-item" data-title="Quản lý người dùng">
                <i class="fas fa-users"></i>
            </div>
            <div class="menu-item" id="booking-management-menu-item" data-title="Quản lý đặt phòng">
                <i class="fas fa-calendar-check"></i>
            </div>
            <div class="menu-item" id="notifications-menu-item" data-title="Thông báo">
                <i class="fas fa-bell"></i>
            </div>
            <div class="menu-item" id="statistics-menu-item" data-title="Thống kê">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Quản lý chung</h1>
            <div class="user-controls">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        
        <div class="content-container">
            <div class="filter-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Tìm kiếm...">
                    <div class="search-icon">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                
                <div class="filter-input-container" style="display: inline-block; position: relative;">
                    <input type="number" class="filter-input" id="capacity-filter" placeholder="Sức chứa" min="0" style="padding: 8px 12px; border-radius: 5px; border: 1px solid #ddd; width: 120px;">
                    <!-- <span style="display: block; font-size: 12px; color: #666; margin-top: 2px;">Tìm phòng có sức chứa ≥ người</span> -->
                </div>
                
                <select class="filter-select" id="status-filter">
                    <option value="">Tình trạng</option>
                    <option value="available">Còn trống</option>
                    <option value="unavailable">Đang sử dụng</option>
                    <option value="maintenance">Bảo trì</option>
                </select>
                
                <select class="filter-select" id="room-type-filter">
                    <option value="">Loại phòng</option>
                    <!-- Will be populated from API -->
                </select>
                
                <select class="filter-select" id="location-filter">
                    <option value="">Tòa</option>
                    <option value="H1">H1</option>
                    <option value="H2">H2</option>
                    <option value="H3">H3</option>
                    <option value="H6">H6</option>
                </select>
            </div>
            
            <div class="card-container" id="rooms-container">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...
                </div>
            </div>
        </div>
    </div>

    <script>
        let roomsData = [];
        let roomTypes = [];
        
        const ENDPOINTS = {
            ROOMS: '/api/rooms',
            ROOM_TYPES: '/api/rooms/types'
        };
        
        const roomTypeLabels = {
            'classroom': 'Phòng học',
            'meeting': 'Phòng họp',
            'lab': 'Phòng thí nghiệm',
            'computer': 'Phòng máy tính',
            'lecture': 'Giảng đường',
            'study': 'Không gian học tập'
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAuth();
            
            initializeOverviewPage();
            
            setupEventListeners();
        });
        
        function setupNavigation() {
            document.getElementById('overview-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-overview.html';
            });
            
            document.getElementById('room-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-room-management.html';
            });
            
            document.getElementById('user-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-user-management.html';
            });
            
            document.getElementById('booking-management-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-booking-management.html';
            });
            
            document.getElementById('statistics-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-statistics.html';
            });
            
            document.getElementById('notifications-menu-item').addEventListener('click', function() {
                window.location.href = 'admin-notifications.html';
            });
            
            document.getElementById('logout-btn').addEventListener('click', function() {
                logout();
            });
        }
        
        function checkAdminAuth() {
            setupNavigation();
        }
        
        async function initializeOverviewPage() {
            try {
                setupFilters();
                
                await loadRoomTypes();
                
                await loadRooms();
                
                renderRooms(roomsData);
            } catch (error) {
                console.error('Error initializing overview page:', error);
                const roomsContainer = document.getElementById('rooms-container');
                roomsContainer.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Đã xảy ra lỗi khi tải dữ liệu. Vui lòng thử lại sau.</p>
                        <button class="btn btn-primary" onclick="window.location.reload()">Thử lại</button>
                    </div>
                `;
            }
        }
        
        function setupEventListeners() {
            setupNavigation();
        }
        
        function setupFilters() {
            const searchInput = document.getElementById('search-input');
            const capacityFilter = document.getElementById('capacity-filter');
            const statusFilter = document.getElementById('status-filter');
            const roomTypeFilter = document.getElementById('room-type-filter');
            const locationFilter = document.getElementById('location-filter');
            
            searchInput.addEventListener('input', applyFilters);
            capacityFilter.addEventListener('input', applyFilters);
            statusFilter.addEventListener('change', applyFilters);
            roomTypeFilter.addEventListener('change', applyFilters);
            locationFilter.addEventListener('change', applyFilters);
        }
        
        async function loadRoomTypes() {
            try {
                const response = await fetch(ENDPOINTS.ROOM_TYPES, {
                    credentials: 'include'
                });
                
                if (!response.ok) throw new Error('Failed to fetch room types');
                
                roomTypes = await response.json();
                
                const roomTypeFilter = document.getElementById('room-type-filter');
                
                roomTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type.code;
                    option.textContent = type.name;
                    roomTypeFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading room types:', error);
                throw error;
            }
        }
        
        async function loadRooms() {
            try {
                const response = await fetch(ENDPOINTS.ROOMS, {
                    credentials: 'include'
                });
                
                if (!response.ok) throw new Error('Failed to fetch rooms');
                
                roomsData = await response.json();
            } catch (error) {
                console.error('Error loading rooms:', error);
                throw error;
            }
        }
        
        function applyFilters() {
            const searchValue = document.getElementById('search-input').value.toLowerCase();
            const capacityValue = document.getElementById('capacity-filter').value;
            const statusValue = document.getElementById('status-filter').value;
            const roomTypeValue = document.getElementById('room-type-filter').value;
            const locationValue = document.getElementById('location-filter').value;
            
            let filteredRooms = [...roomsData];
            
            if (searchValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.room_name.toLowerCase().includes(searchValue) || 
                    room.location?.toLowerCase().includes(searchValue)
                );
            }
            
            if (capacityValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.capacity >= parseInt(capacityValue)
                );
            }
            
            if (statusValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.status === statusValue
                );
            }
            
            if (roomTypeValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.room_type === roomTypeValue
                );
            }
            
            if (locationValue) {
                filteredRooms = filteredRooms.filter(room => 
                    room.location === locationValue
                );
            }
            
            renderRooms(filteredRooms);
        }
        
        function renderRooms(rooms) {
            const roomsContainer = document.getElementById('rooms-container');
            roomsContainer.innerHTML = '';
            
            if (!rooms || rooms.length === 0) {
                roomsContainer.innerHTML = `
                    <div class="no-data">
                        <p>Không tìm thấy phòng nào phù hợp với bộ lọc.</p>
                    </div>
                `;
                return;
            }
            
            rooms.forEach(room => {
                const roomTypeName = roomTypeLabels[room.room_type] || 
                                   roomTypes.find(t => t.code === room.room_type)?.name || 
                                   room.room_type;
                
                let facilities = 'Không có';
                if (room.facilities) {
                    try {
                        const facilitiesObj = typeof room.facilities === 'string' ? JSON.parse(room.facilities) : room.facilities;
                        const facilitiesArray = [];
                        
                        const equipmentMap = {
                            'projector': 'Máy chiếu',
                            'computer': 'Máy tính',
                            'air_conditioner': 'Điều hòa',
                            'whiteboard': 'Bảng',
                            'table': 'Bàn',
                            'chair': 'Ghế',
                            'sound_system': 'Hệ thống âm thanh',
                            'wifi': 'Hệ thống wifi',
                            'microphone': 'Micro',
                            'speaker': 'Loa',
                            'screen': 'Màn hình',
                            'camera': 'Camera'
                        };
                        
                        for (const [key, value] of Object.entries(facilitiesObj)) {
                            if (value && value > 0) {
                                const translatedName = equipmentMap[key] || key;
                                facilitiesArray.push(`${translatedName}: ${value}`);
                            }
                        }
                        facilities = facilitiesArray.join(', ');
                    } catch (e) {
                        console.error('Error parsing facilities:', e);
                    }
                }
                
                let statusText = 'Không rõ';
                switch(room.status) {
                    case 'available':
                        statusText = 'Còn trống';
                        break;
                    case 'unavailable':
                        statusText = 'Đang sử dụng';
                        break;
                    case 'maintenance':
                        statusText = 'Bảo trì';
                        break;
                }
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <p><strong>Phòng:</strong> ${room.room_name}, <strong>Tòa:</strong> ${room.location}, <strong>Tình trạng:</strong> ${statusText}, <strong>Sức chứa:</strong> ${room.capacity} người</p>
                        <p><strong>Loại phòng:</strong> ${roomTypeName}</p>
                        <p><strong>Thiết bị:</strong> ${facilities}</p>
                    </div>
                    <div class="card-actions">
                        <a href="admin-room-details.html?id=${room.id}" class="details-link">Xem chi tiết</a>
                        <button class="btn btn-primary toggle-status-btn" data-room-id="${room.id}" data-room-status="${room.status}">
                            <i class="fas fa-sync-alt"></i> ${room.status === 'available' ? 'Đóng phòng' : 'Mở phòng'}
                        </button>
                    </div>
                `;
                
                roomsContainer.appendChild(card);
            });
            
            document.querySelectorAll('.toggle-status-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const roomId = this.getAttribute('data-room-id');
                    const currentStatus = this.getAttribute('data-room-status');
                    toggleRoomStatus(roomId, currentStatus);
                });
            });
        }
        
        async function toggleRoomStatus(roomId, currentStatus) {
            try {
                const newStatus = currentStatus === 'available' ? 'maintenance' : 'available';
                
                const response = await fetch(`${ENDPOINTS.ROOMS}/${roomId}/status`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (!response.ok) throw new Error('Failed to update room status');
                
                const updatedRoom = await response.json();
                
                const roomIndex = roomsData.findIndex(r => r.id === roomId);
                if (roomIndex !== -1) {
                    roomsData[roomIndex] = updatedRoom.room;
                }
                
                applyFilters();
                
                alert(`Trạng thái phòng đã được cập nhật thành ${newStatus === 'available' ? 'Còn trống' : 'Bảo trì'}`);
                
                location.reload();
            } catch (error) {
                console.error('Error updating room status:', error);
                alert(`Lỗi khi cập nhật trạng thái phòng: ${error.message}`);
            }
        }
    </script>
</body>
</html>
