<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông báo - HCMUT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin-dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="js/auth.js" defer></script>
  <style>
    .menu-item.logo-item {
      padding: 10px 0;
      margin-bottom: 20px;
    }

    .logo {
      width: 60px;
      height: 60px;
      max-width: 100%;
      object-fit: contain;
    }

    .menu-item.active {
      background-color: #28a745;
      color: white;
    }
    .header {
      background: var(--main-gradient);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 4px rgba(0,0,0,0.25);
    }
    .notification-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    
    .notification-tab {
      padding: 10px 15px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-weight: 500;
    }
    
    .notification-tab.active {
      border-bottom-color: #005baa;
      color: #005baa;
    }
    
    .notification-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .notification-item {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 15px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .notification-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .notification-item.unread {
      border-left: 4px solid #005baa;
    }
    
    .notification-item.unread::before {
      content: '';
      width: 8px;
      height: 8px;
      background-color: #005baa;
      border-radius: 50%;
      position: absolute;
      top: 15px;
      right: 15px;
    }
    
    .notification-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    
    .notification-item.unread .notification-title {
      color: #005baa;
    }
    
    .notification-content {
      color: #666;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .notification-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #999;
      font-size: 12px;
    }
    
    .notification-sender {
      font-style: italic;
    }
    
    .notification-actions {
      display: flex;
      gap: 10px;
    }
    
    .action-btn {
      border: none;
      background: none;
      cursor: pointer;
      color: #999;
      transition: color 0.2s;
    }
    
    .action-btn:hover {
      color: #005baa;
    }
    
    .notification-date {
      margin-top: 5px;
      color: #999;
      font-size: 12px;
    }
    
    .no-notifications {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .no-notifications i {
      font-size: 48px;
      color: #ccc;
      margin-bottom: 20px;
    }
    
    .no-notifications h3 {
      margin-bottom: 10px;
      color: #333;
    }
    
    .no-notifications p {
      color: #666;
    }
    
    .notification-actions-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    
    .mark-all-read-btn {
      padding: 6px 12px;
      background-color: transparent;
      border: 1px solid #005baa;
      color: #005baa;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    
    .mark-all-read-btn:hover {
      background-color: #005baa;
      color: white;
    }
    
    /* Modal styles */
    .notification-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    
    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    
    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }
    
    .close-modal {
      font-size: 24px;
      cursor: pointer;
    }
    
    .modal-body {
      margin-bottom: 20px;
    }
    
    .modal-footer {
      display: flex;
      justify-content: space-between;
      color: #999;
      font-size: 12px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 5px;
    }
    
    .page-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ddd;
      background-color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    
    .page-btn.active {
      background-color: #005baa;
      color: white;
      border-color: #005baa;
    }
    
    .page-btn.disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    /* Styles cho ô tìm kiếm */
    .notification-search-container {
      margin-bottom: 15px;
    }
    
    .notification-search {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    
    .notification-search:focus {
      border-color: #005baa;
      box-shadow: 0 0 5px rgba(0, 91, 170, 0.2);
      outline: none;
    }
  </style>
</head>
<body class="admin-dashboard">
  <div class="sidebar">
    <div class="menu">
      <div class="menu-item logo-item">
        <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
      </div>
      <div class="menu-item" id="dashboard-menu-item" data-title="Trang chủ">
        <i class="fas fa-tachometer-alt"></i>
      </div>
      <div class="menu-item" id="room-booking-menu-item" data-title="Đặt phòng">
        <i class="fas fa-door-open"></i>
      </div>
      <div class="menu-item" id="booking-history-menu-item" data-title="Lịch sử đặt phòng">
        <i class="fas fa-history"></i>
      </div>
      <div class="menu-item active" id="notifications-menu-item" data-title="Thông báo">
        <i class="fas fa-bell"></i>
      </div>
      <div class="menu-item" id="profile-menu-item" data-title="Thông tin cá nhân">
        <i class="fas fa-user"></i>
      </div>
      <div class="menu-item" id="statistics-menu-item" data-title="Thống kê">
        <i class="fas fa-chart-bar"></i>
      </div>
      <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
        <i class="fas fa-sign-out-alt"></i>
      </div>
    </div>
  </div>
  
  <div class="main-content">
    <div class="header">
      <div class="header-title">Thông báo</div>
      <div class="user-info">
        <div class="user-greeting" id="user-greeting">Xin chào, <span id="user-full-name">Sinh viên</span></div>
        <div class="notification-bell" id="notification-bell">
          <i class="fas fa-bell"></i>
          <span class="notification-count" id="notification-count">0</span>
        </div>
      </div>
    </div>
    
    <div class="dashboard-content">
      <div class="section-header">
        <h2>Thông báo</h2>
        <p>Xem tất cả thông báo từ hệ thống</p>
      </div>
      
      <div class="notification-tabs">
        <div class="notification-tab active" data-status="all">Tất cả</div>
        <div class="notification-tab" data-status="unread">Chưa đọc</div>
        <div class="notification-tab" data-status="system">Hệ thống</div>
        <div class="notification-tab" data-status="booking">Đặt phòng</div>
      </div>
      
      <!-- Thêm ô tìm kiếm thông báo -->
      <div class="notification-search-container">
        <input type="text" id="notification-search-input" class="notification-search" placeholder="Tìm kiếm tiêu đề hoặc nội dung...">
      </div>
      
      <div class="notification-actions-header">
        <button id="mark-all-read-btn" class="mark-all-read-btn">Đánh dấu tất cả đã đọc</button>
      </div>
      
      <div class="loading-spinner" id="notifications-loading">
        <div class="spinner"></div>
        <p>Đang tải thông báo...</p>
      </div>
      
      <div id="notification-list" class="notification-list">
        <!-- Notification items will be inserted here -->
      </div>
      
      <div id="no-notifications" class="no-notifications" style="display:none">
        <i class="fas fa-bell-slash"></i>
        <h3>Không có thông báo nào</h3>
        <p>Bạn chưa có thông báo nào.</p>
      </div>
      
      <div id="pagination" class="pagination">
        <!-- Pagination buttons will be inserted here -->
      </div>
    </div>
  </div>
  
  <!-- Notification Detail Modal -->
  <div id="notification-modal" class="notification-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-notification-title">Tiêu đề thông báo</h2>
        <span class="close-modal" id="close-notification-modal">&times;</span>
      </div>
      <div class="modal-body" id="modal-notification-body">
        <!-- Notification content will be inserted here -->
      </div>
      <div class="modal-footer">
        <div id="modal-notification-sender">Từ: Hệ thống</div>
        <div id="modal-notification-date">Ngày: 01/01/2023</div>
      </div>
    </div>
  </div>
  
  <script>
    // API endpoints
    const API_BASE_URL = '/api';
    const ENDPOINTS = {
      USERS: `${API_BASE_URL}/users`,
      NOTIFICATIONS: `${API_BASE_URL}/notifications`,
      NOTIFICATIONS_BY_TYPE: `${API_BASE_URL}/notifications/type/:type`,
      UNREAD_NOTIFICATIONS: `${API_BASE_URL}/notifications/unread/count`,
      MARK_READ: `${API_BASE_URL}/notifications/:id/read`,
      STUDENT_MARK_READ: `${API_BASE_URL}/notifications/student-mark-read/:id`,
      MARK_ALL_READ: `${API_BASE_URL}/notifications/mark-all-read`,
      DELETE_NOTIFICATION: `${API_BASE_URL}/notifications/:id`,
      AUTH_VERIFY: `${API_BASE_URL}/auth/verify`,
      AUTH_LOGOUT: `${API_BASE_URL}/auth/logout`
    };
    
    // State variables
    let currentUser = null;
    let allNotifications = [];
    let filteredNotifications = [];
    let currentType = 'all';
    let currentPage = 1;
    const notificationsPerPage = 10;
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user is authenticated
      verifyAuth()
        .then(userData => {
          if (userData && userData.role === 'student') {
            currentUser = userData;
            setupNavigation();
            initializePage();
          } else {
            console.error('User is not a student or is not authenticated');
            clearAuthData();
            window.location.href = 'index.html';
          }
        })
        .catch(error => {
          console.error('Authentication error:', error.message);
          clearAuthData();
          window.location.href = 'index.html';
        });
    });
    
    // Setup navigation
    function setupNavigation() {
      document.getElementById('dashboard-menu-item').addEventListener('click', function() {
        window.location.href = 'student-dashboard.html';
      });
      
      document.getElementById('room-booking-menu-item').addEventListener('click', function() {
        window.location.href = 'student-room-reservation.html';
      });
      
      document.getElementById('booking-history-menu-item').addEventListener('click', function() {
        window.location.href = 'student-booking-history.html';
      });
      
      document.getElementById('notifications-menu-item').addEventListener('click', function() {
        window.location.href = 'student-notifications.html';
      });
      
      document.getElementById('profile-menu-item').addEventListener('click', function() {
        window.location.href = 'student-profile.html';
      });
      
      document.getElementById('statistics-menu-item').addEventListener('click', function() {
        window.location.href = 'student-statistics.html';
      });
      
      document.getElementById('logout-btn').addEventListener('click', async function() {
        try {
          const response = await fetch(ENDPOINTS.AUTH_LOGOUT, {
            method: 'POST',
            credentials: 'include'
          });
          
          clearAuthData();
          window.location.href = 'index.html';
        } catch (error) {
          console.error('Logout error:', error);
          clearAuthData();
          window.location.href = 'index.html';
        }
      });
      
      // Set up notification bell click
      document.getElementById('notification-bell').addEventListener('click', function() {
        window.location.href = 'student-notifications.html';
      });
    }
    
    // Clear auth data
    function clearAuthData() {
      sessionStorage.removeItem('user');
      localStorage.removeItem('authToken');
    }
    
    // Initialize page
    async function initializePage() {
      // Set user greeting
      document.getElementById('user-greeting').innerHTML = `Xin chào, <span id="user-full-name">${currentUser.full_name || currentUser.username}</span>`;
      
      // Load unread notifications count
      loadNotificationsCount();
      
      // Set up notification tabs
      const notificationTabs = document.querySelectorAll('.notification-tab');
      notificationTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          // Remove active class from all tabs
          notificationTabs.forEach(t => t.classList.remove('active'));
          
          // Add active class to clicked tab
          this.classList.add('active');
          
          // Update current type
          currentType = this.getAttribute('data-status');
          
          // Reset to first page
          currentPage = 1;
          
          // Load notifications with the new type directly
          loadNotifications();
        });
      });
      
      // Set up search functionality
      const searchInput = document.getElementById('notification-search-input');
      searchInput.addEventListener('input', function() {
        filterNotificationsBySearch(this.value);
      });
      
      // Set up mark all read button
      document.getElementById('mark-all-read-btn').addEventListener('click', markAllAsRead);
      
      // Set up modal close button
      document.getElementById('close-notification-modal').addEventListener('click', closeNotificationModal);
      
      // Load notifications
      await loadNotifications();
    }
    
    // Filter notifications by search term
    function filterNotificationsBySearch(searchTerm) {
      searchTerm = searchTerm.toLowerCase().trim();
      
      if (!searchTerm) {
        // Nếu không có từ khóa tìm kiếm, hiển thị lại tất cả thông báo
        filterNotifications();
        return;
      }
      
      // Lọc từ mảng allNotifications nếu đang ở tab "Tất cả"
      // hoặc từ filteredNotifications nếu đang ở tab khác
      const notificationsToFilter = currentType === 'all' ? [...allNotifications] : [...filteredNotifications];
      
      // Lọc thông báo theo tiêu đề hoặc nội dung
      filteredNotifications = notificationsToFilter.filter(notification => {
        const title = notification.title ? notification.title.toLowerCase() : '';
        const content = notification.content ? notification.content.toLowerCase() : 
                       (notification.message ? notification.message.toLowerCase() : '');
        
        return title.includes(searchTerm) || content.includes(searchTerm);
      });
      
      // Reset về trang đầu tiên
      currentPage = 1;
      
      // Hiển thị kết quả
      displayNotifications();
      setupPagination();
    }
    
    // Load notifications count
    async function loadNotificationsCount() {
      try {
        const response = await fetch(ENDPOINTS.UNREAD_NOTIFICATIONS, {
          credentials: 'include'
        });
        
        if (response.ok) {
          const data = await response.json();
          document.getElementById('notification-count').textContent = data.count;
          
          // Show notification count only if there are unread notifications
          if (data.count > 0) {
            document.getElementById('notification-count').style.display = 'inline-block';
          } else {
            document.getElementById('notification-count').style.display = 'none';
          }
        }
      } catch (error) {
        console.error('Error loading notifications count:', error);
      }
    }
    
    // Load notifications
    async function loadNotifications() {
      try {
        // Show loading spinner
        document.getElementById('notifications-loading').style.display = 'flex';
        document.getElementById('notification-list').innerHTML = '';
        document.getElementById('no-notifications').style.display = 'none';
        document.getElementById('pagination').innerHTML = '';
        
        // Sử dụng API phân loại thông báo theo loại
        const endpoint = currentType === 'all' 
          ? ENDPOINTS.NOTIFICATIONS
          : ENDPOINTS.NOTIFICATIONS_BY_TYPE.replace(':type', currentType);
        
        const response = await fetch(endpoint, {
          credentials: 'include'
        });
        
        if (!response.ok) {
          throw new Error('Failed to fetch notifications');
        }
        
        // Hide loading spinner
        document.getElementById('notifications-loading').style.display = 'none';
        
        const notifications = await response.json();
        
        if (currentType === 'all') {
          // Nếu lấy tất cả thông báo, lưu trữ lại để sử dụng sau này
          allNotifications = notifications;
        }
        
        // Sort notifications by date (newest first)
        filteredNotifications = notifications.sort((a, b) => {
          return new Date(b.created_at) - new Date(a.created_at);
        });
        
        // Hiển thị thông báo và phân trang
        displayNotifications();
        setupPagination();
        
      } catch (error) {
        console.error('Error loading notifications:', error);
        document.getElementById('notifications-loading').style.display = 'none';
        document.getElementById('no-notifications').style.display = 'block';
      }
    }
    
    // Filter notifications based on current type
    function filterNotifications() {
      // Thay vì lọc phía client, gọi API với type tương ứng
      loadNotifications();
    }
    
    // Display notifications for current page
    function displayNotifications() {
      const notificationListContainer = document.getElementById('notification-list');
      notificationListContainer.innerHTML = '';
      
      if (filteredNotifications.length === 0) {
        document.getElementById('no-notifications').style.display = 'block';
        return;
      }
      
      document.getElementById('no-notifications').style.display = 'none';
      
      // Calculate notifications for current page
      const startIndex = (currentPage - 1) * notificationsPerPage;
      const endIndex = Math.min(startIndex + notificationsPerPage, filteredNotifications.length);
      const notificationsToDisplay = filteredNotifications.slice(startIndex, endIndex);
      
      notificationsToDisplay.forEach(notification => {
        const notificationItem = document.createElement('div');
        notificationItem.className = `notification-item ${notification.is_read ? '' : 'unread'}`;
        notificationItem.setAttribute('data-id', notification.id);
        
        // Format date
        const createdDate = new Date(notification.created_at);
        const formattedDate = createdDate.toLocaleDateString('vi-VN') + ' ' + createdDate.toLocaleTimeString('vi-VN');
        
        // Create HTML for notification item
        let actionButtons = `
          <button class="action-btn mark-read-btn" data-id="${notification.id}" title="Đánh dấu đã đọc" ${notification.is_read ? 'style="display:none;"' : ''}>
            <i class="far fa-check-circle"></i>
          </button>`;

        // Only show delete buttons for admin users
        if (currentUser && currentUser.role === 'admin') {
          actionButtons += `
          <button class="action-btn delete-btn" data-id="${notification.id}" title="Xóa thông báo">
            <i class="far fa-trash-alt"></i>
          </button>`;
        }

        notificationItem.innerHTML = `
          <h3 class="notification-title">${notification.title}</h3>
          <div class="notification-content">${getNotificationExcerpt(notification.content)}</div>
          <div class="notification-footer">
            <div class="notification-sender">Từ: ${notification.sender || 'Hệ thống'}</div>
            <div class="notification-actions">
              ${actionButtons}
            </div>
          </div>
          <div class="notification-date">${formattedDate}</div>
        `;
        
        notificationListContainer.appendChild(notificationItem);
        
        // Add click event to open notification detail
        notificationItem.addEventListener('click', function(e) {
          // Don't open detail if clicking on action buttons
          if (e.target.closest('.notification-actions')) {
            return;
          }
          
          const notificationId = this.getAttribute('data-id');
          openNotificationDetail(notificationId);
        });
      });
      
      // Add event listeners to action buttons
      addActionButtonEventListeners();
    }
    
    // Get notification excerpt (first 100 characters)
    function getNotificationExcerpt(content) {
      if (!content) return '';
      
      // Strip HTML tags
      const plainText = content.replace(/<[^>]+>/g, '');
      
      if (plainText.length <= 100) {
        return plainText;
      }
      
      return plainText.substring(0, 100) + '...';
    }
    
    // Add event listeners to action buttons
    function addActionButtonEventListeners() {
      // Mark as read buttons
      const markReadButtons = document.querySelectorAll('.mark-read-btn');
      markReadButtons.forEach(button => {
        button.addEventListener('click', function(e) {
          e.stopPropagation(); // Prevent opening notification detail
          const notificationId = this.getAttribute('data-id');
          markAsRead(notificationId);
        });
      });
      
      // Delete buttons should only be shown for admin users
      if (currentUser && currentUser.role === 'admin') {
        const deleteButtons = document.querySelectorAll('.delete-btn');
        deleteButtons.forEach(button => {
          button.addEventListener('click', function(e) {
            e.stopPropagation(); // Prevent opening notification detail
            const notificationId = this.getAttribute('data-id');
            deleteNotification(notificationId);
          });
        });
      }
    }
    
    // Setup pagination
    function setupPagination() {
      const totalPages = Math.ceil(filteredNotifications.length / notificationsPerPage);
      const paginationContainer = document.getElementById('pagination');
      paginationContainer.innerHTML = '';
      
      if (totalPages <= 1) {
        return;
      }
      
      // Previous button
      const prevButton = document.createElement('button');
      prevButton.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
      prevButton.innerHTML = '<i class="fas fa-chevron-left"></i>';
      if (currentPage > 1) {
        prevButton.addEventListener('click', () => {
          currentPage--;
          displayNotifications();
          setupPagination();
        });
      }
      paginationContainer.appendChild(prevButton);
      
      // Page buttons
      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(totalPages, currentPage + 2);
      
      for (let i = startPage; i <= endPage; i++) {
        const pageButton = document.createElement('button');
        pageButton.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageButton.textContent = i;
        
        pageButton.addEventListener('click', () => {
          currentPage = i;
          displayNotifications();
          setupPagination();
        });
        
        paginationContainer.appendChild(pageButton);
      }
      
      // Next button
      const nextButton = document.createElement('button');
      nextButton.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
      nextButton.innerHTML = '<i class="fas fa-chevron-right"></i>';
      if (currentPage < totalPages) {
        nextButton.addEventListener('click', () => {
          currentPage++;
          displayNotifications();
          setupPagination();
        });
      }
      paginationContainer.appendChild(nextButton);
    }
    
    // Mark a notification as read
    async function markAsRead(notificationId) {
      try {
        console.log(`Marking notification ${notificationId} as read...`);
        
        // Always update UI first for responsiveness
        // Update notification in local data
        const notification = allNotifications.find(n => n.id == notificationId);
        if (notification) {
          notification.is_read = true;
          console.log(`Updated notification ${notificationId} to read in local data`);
        }
        
        // Update UI
        const notificationItem = document.querySelector(`.notification-item[data-id="${notificationId}"]`);
        if (notificationItem) {
          notificationItem.classList.remove('unread');
          const markReadBtn = notificationItem.querySelector('.mark-read-btn');
          if (markReadBtn) {
            markReadBtn.style.display = 'none';
          }
          console.log(`Updated UI for notification ${notificationId}`);
        }
        
        // Now try server update with error handling
        try {
          // Sử dụng endpoint đặc biệt dành cho sinh viên
          const response = await fetch(ENDPOINTS.STUDENT_MARK_READ.replace(':id', notificationId), {
            method: 'PUT',
            credentials: 'include'
          });
          
          if (!response.ok) {
            let errorMsg = 'Failed to mark notification as read';
            try {
              const errorData = await response.json();
              if (errorData && errorData.error) {
                errorMsg = errorData.error;
              }
            } catch (e) {
              errorMsg = `${errorMsg}: ${response.status} ${response.statusText}`;
            }
            console.error(`Server error: ${errorMsg}`);
          } else {
            console.log(`Successfully marked notification ${notificationId} as read on server`);
          }
        } catch (serverError) {
          console.error('Network error marking notification as read:', serverError);
        }
        
        // Update unread count
        loadNotificationsCount();
      } catch (error) {
        console.error('Fatal error in markAsRead function:', error);
      }
    }
    
    // Mark all notifications as read
    async function markAllAsRead() {
      try {
        // Update all notifications in local data immediately
        allNotifications.forEach(notification => {
          notification.is_read = true;
        });
        
        // Xóa nội dung ô tìm kiếm
        const searchInput = document.getElementById('notification-search-input');
        if (searchInput) {
          searchInput.value = '';
        }
        
        // Refresh display immediately
        filterNotifications();
        
        // Update unread count
        document.getElementById('notification-count').textContent = '0';
        document.getElementById('notification-count').style.display = 'none';
        
        // Now try to update on server using the standard endpoint
        const response = await fetch(ENDPOINTS.MARK_ALL_READ, {
          method: 'POST',
          credentials: 'include'
        });
        
        if (!response.ok) {
          let errorMsg = 'Failed to mark all notifications as read';
          try {
            const errorData = await response.json();
            if (errorData && errorData.error) {
              errorMsg = errorData.error;
            }
          } catch (e) {
            errorMsg = `${errorMsg}: ${response.status} ${response.statusText}`;
          }
          
          // Just log the error but don't disturb the user
          console.error(`Server error: ${errorMsg}`);
        } else {
          console.log('Successfully marked all notifications as read on server');
        }
      } catch (error) {
        console.error('Error in markAllAsRead function:', error);
        // No alert to the user since UI is already updated
      }
    }
    
    // Delete a notification
    async function deleteNotification(notificationId) {
      // Only admins can delete notifications
      if (!currentUser || currentUser.role !== 'admin') {
        console.error('Only administrators can delete notifications');
        return;
      }
      
      if (!confirm('Bạn có chắc chắn muốn xóa thông báo này không?')) {
        return;
      }
      
      try {
        console.log(`Deleting notification ${notificationId}...`);
        
        // Remove notification from local data immediately for a responsive UI
        allNotifications = allNotifications.filter(n => n.id != notificationId);
        
        // Update UI immediately, regardless of server response
        filterNotifications();
        
        // Attempt to delete on server using the standard endpoint
        const response = await fetch(ENDPOINTS.DELETE_NOTIFICATION.replace(':id', notificationId), {
          method: 'DELETE',
          credentials: 'include'
        });
        
        if (!response.ok) {
          // Get detailed error message from response if available
          let errorMsg = 'Failed to delete notification';
          try {
            const errorData = await response.json();
            if (errorData && errorData.error) {
              errorMsg = errorData.error;
            }
          } catch (e) {
            // If parsing JSON fails, use status text
            errorMsg = `${errorMsg}: ${response.status} ${response.statusText}`;
          }
          
          // Log error but don't alert user since we've already updated the UI
          console.error(`Server error deleting notification: ${errorMsg}`);
        } else {
          console.log(`Successfully deleted notification ${notificationId} on server`);
        }
        
        // Update unread count
        loadNotificationsCount();
        
      } catch (error) {
        console.error('Error in deleteNotification function:', error);
        // Don't notify user as the UI has already been updated
      }
    }
    
    // Open notification detail modal
    function openNotificationDetail(notificationId) {
      const notification = allNotifications.find(n => n.id == notificationId);
      if (!notification) return;
      
      // Set modal content
      document.getElementById('modal-notification-title').textContent = notification.title;
      
      // Make sure content is available, fallback to message if needed
      const contentToDisplay = notification.content || notification.message || 'Không có nội dung';
      document.getElementById('modal-notification-body').innerHTML = contentToDisplay;
      document.getElementById('modal-notification-sender').textContent = `Từ: ${notification.sender || 'Hệ thống'}`;
      
      // Format date
      const createdDate = new Date(notification.created_at);
      const formattedDate = createdDate.toLocaleDateString('vi-VN') + ' ' + createdDate.toLocaleTimeString('vi-VN');
      document.getElementById('modal-notification-date').textContent = `Ngày: ${formattedDate}`;
      
      // Show modal first, so user can see content immediately
      document.getElementById('notification-modal').style.display = 'block';
      
      // Update UI to mark as read locally even if server request might fail
      if (!notification.is_read) {
        notification.is_read = true;
        
        const notificationItem = document.querySelector(`.notification-item[data-id="${notificationId}"]`);
        if (notificationItem) {
          notificationItem.classList.remove('unread');
          const markReadBtn = notificationItem.querySelector('.mark-read-btn');
          if (markReadBtn) {
            markReadBtn.style.display = 'none';
          }
        }
        
        // Attempt to update on server, but don't block UI
        markAsRead(notificationId).catch(error => {
          console.error('Error when marking notification as read from modal:', error);
          // Don't alert the user to prevent disrupting their experience
        });
      }
    }
    
    // Close notification detail modal
    function closeNotificationModal() {
      document.getElementById('notification-modal').style.display = 'none';
    }
  </script>
