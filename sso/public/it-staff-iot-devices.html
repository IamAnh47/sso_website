<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thiết bị IoT - IT Staff</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #6c757d;
        }
        
        .breadcrumb-item {
            display: flex;
            align-items: center;
        }
        
        .breadcrumb-separator {
            margin: 0 5px;
        }
        
        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .room-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .room-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .room-name {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }
        
        .room-id {
            font-size: 14px;
            color: #6c757d;
        }
        
        .room-status {
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-available {
            background-color: #d4edda;
            color: #28a745;
        }
        
        .status-occupied {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .status-maintenance {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .device-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        
        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        
        .device-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .device-type {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .device-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }
        
        .device-icon.projector {
            background-color: #4a6cf7;
        }
        
        .device-icon.computer {
            background-color: #3cb371;
        }
        
        .device-icon.air_conditioner {
            background-color: #00a8e8;
        }
        
        .device-icon.speaker {
            background-color: #f25f5c;
        }
        
        .device-icon.light {
            background-color: #ffd166;
        }
        
        .device-icon.fan {
            background-color: #8ac926;
        }
        
        .device-name {
            font-weight: 600;
        }
        
        .device-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-on {
            background-color: #d4edda;
            color: #28a745;
        }
        
        .status-off {
            background-color: #f8f9fa;
            color: #6c757d;
        }
        
        .status-maintenance {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .device-image {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            padding: 10px;
        }
        
        .device-image img {
            max-width: 100%;
            max-height: 130px;
            object-fit: contain;
        }
        
        .device-info {
            padding: 15px;
        }
        
        .device-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .info-label {
            color: #6c757d;
        }
        
        .info-value {
            font-weight: 500;
            color: #343a40;
        }
        
        .device-actions {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #f0f0f0;
        }
        
        .btn {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid #dee2e6;
            color: #6c757d;
        }
        
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 30px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #28a745;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toggle-label {
            font-weight: 500;
        }
        
        .maintenance-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background-color: #fff3cd;
            color: #ffc107;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
        }
        
        @media (max-width: 768px) {
            .devices-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="admin-dashboard">
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item logo-item">
                <img src="./images/hcmut_logo.png" alt="Logo" class="logo">
            </div>
            <div class="menu-item" id="dashboard-menu-item" data-title="Dashboard">
                <i class="fas fa-tachometer-alt"></i>
            </div>
            <div class="menu-item" id="rooms-menu-item" data-title="Quản lý phòng">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="menu-item active" id="devices-menu-item" data-title="Thiết bị IoT">
                <i class="fas fa-microchip"></i>
            </div>
            <div class="menu-item" id="profile-menu-item" data-title="Thông tin cá nhân">
                <i class="fas fa-user"></i>
            </div>
            <div class="menu-item" id="logout-btn" data-title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Quản lý thiết bị IoT</h1>
            <div class="user-controls">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        
        <div class="content-container">
            <div class="breadcrumb">
                <div class="breadcrumb-item">
                    <a href="it-staff-dashboard.html">Trang chủ</a>
                </div>
                <div class="breadcrumb-separator">
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="breadcrumb-item">
                    <a href="it-staff-room-management.html">Quản lý phòng</a>
                </div>
                <div class="breadcrumb-separator">
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="breadcrumb-item">
                    <span>Thiết bị IoT</span>
                </div>
            </div>
            
            <div class="room-header">
                <div class="room-title">
                    <div class="room-icon">
                        <i class="fas fa-door-open"></i>
                    </div>
                    <div>
                        <h2 class="room-name" id="room-name-display">Đang tải...</h2>
                        <div class="room-id" id="room-id-display">ID: ...</div>
                    </div>
                </div>
                <div class="room-status status-available" id="room-status-display">
                    Đang tải...
                </div>
            </div>
            
            <!-- Add Filter Container -->
            <div class="filter-container" style="margin-bottom: 20px; background-color: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: center; width: 100%;">
                    <!-- Search by name -->
                    <div style="position: relative; flex: 1; min-width: 200px;">
                        <input type="text" id="device-name-search" placeholder="Tìm kiếm theo tên..." style="width: 100%; padding: 10px 15px 10px 40px; border-radius: 5px; border: 1px solid #ced4da; font-size: 14px;">
                        <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #6c757d;"></i>
                    </div>
                    
                    <!-- Filter by type -->
                    <div style="min-width: 150px;">
                        <select id="device-type-filter" style="width: 100%; padding: 10px 15px; border-radius: 5px; border: 1px solid #ced4da; font-size: 14px;">
                            <option value="">Tất cả loại thiết bị</option>
                            <option value="projector">Máy chiếu</option>
                            <option value="computer">Máy tính</option>
                            <option value="air_conditioner">Điều hòa</option>
                            <option value="speaker">Loa</option>
                            <option value="light">Đèn</option>
                            <option value="fan">Quạt</option>
                        </select>
                    </div>
                    
                    <!-- Filter by status -->
                    <div style="min-width: 150px;">
                        <select id="device-status-filter" style="width: 100%; padding: 10px 15px; border-radius: 5px; border: 1px solid #ced4da; font-size: 14px;">
                            <option value="">Tất cả trạng thái</option>
                            <option value="on">Đang bật</option>
                            <option value="off">Đang tắt</option>
                        </select>
                    </div>
                    
                    <!-- Filter by maintenance -->
                    <div style="min-width: 150px;">
                        <select id="device-maintenance-filter" style="width: 100%; padding: 10px 15px; border-radius: 5px; border: 1px solid #ced4da; font-size: 14px;">
                            <option value="">Tất cả tình trạng</option>
                            <option value="maintenance">Đang bảo trì</option>
                            <option value="normal">Hoạt động bình thường</option>
                        </select>
                    </div>
                    
                    <!-- Reset filters button -->
                    <button id="reset-filters" class="btn btn-outline" style="padding: 10px 15px; border-radius: 5px; background-color: transparent; border: 1px solid #dee2e6; color: #6c757d; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i> Đặt lại bộ lọc
                    </button>
                </div>
            </div>
            
            <div class="devices-grid" id="devices-container">
                <!-- Devices will be populated by JavaScript -->
                <div class="loading-message">Đang tải thiết bị...</div>
            </div>
        </div>
    </div>
    
    <script>
        // API endpoints
        const API_BASE_URL = '/api';
        const ENDPOINTS = {
            ROOMS: `${API_BASE_URL}/rooms`,
            IOT: `${API_BASE_URL}/iot`
        };
        
        // Room and devices data
        let roomData = null;
        let devicesList = [];
        
        // Flag to check if we're using mock data
        let usingMockData = false;
        
        // Mock data for demo purposes when API is not available
        const MOCK_ROOM = {
            id: 1,
            room_name: "P.101",
            room_type: "Phòng học",
            capacity: 50,
            floor: 1,
            status: "available",
            equipment: ["projector", "computer", "air_conditioner", "speaker"]
        };
        
        const MOCK_DEVICES = [
            {
                id: 1,
                device_name: "Máy chiếu Sony",
                device_type: "projector",
                status: "on",
                last_activity: new Date().toISOString()
            },
            {
                id: 2,
                device_name: "Máy tính HP",
                device_type: "computer",
                status: "off",
                last_activity: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString() // yesterday
            },
            {
                id: 3,
                device_name: "Điều hòa LG",
                device_type: "air_conditioner",
                status: "maintenance",
                last_activity: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString() // 3 days ago
            },
            {
                id: 4,
                device_name: "Loa JBL",
                device_type: "speaker",
                status: "on",
                last_activity: new Date(Date.now() - 1 * 60 * 60 * 1000).toISOString() // 1 hour ago
            }
        ];
        
        // Device type icons and images
        const deviceIcons = {
            'projector': 'fas fa-video',
            'computer': 'fas fa-desktop',
            'air_conditioner': 'fas fa-wind',
            'speaker': 'fas fa-volume-up',
            'light': 'fas fa-lightbulb',
            'fan': 'fas fa-fan'
        };
        
        const deviceImages = {
            'projector': 'images/devices/projector.png',
            'computer': 'images/devices/computer.png',
            'air_conditioner': 'images/devices/air-conditioner.png',
            'speaker': 'images/devices/speaker.png',
            'light': 'images/devices/light-bulb.png',
            'fan': 'images/devices/fan.png'
        };
        
        // Device type names in Vietnamese
        const deviceTypeNames = {
            'projector': 'Máy chiếu',
            'computer': 'Máy tính',
            'air_conditioner': 'Điều hòa',
            'speaker': 'Loa',
            'light': 'Đèn',
            'fan': 'Quạt'
        };
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', async function() {
            // Verify user authentication and role
            try {
                const authResponse = await fetch('/api/auth/verify', {
                    credentials: 'include'
                });
                
                if (!authResponse.ok) {
                    throw new Error('Authentication failed');
                }
                
                const authData = await authResponse.json();
                if (authData.user.role !== 'it_staff') {
                    console.error('Unauthorized access attempt');
                    window.location.href = '/index.html';
                    return;
                }
                
                setupNavigation();
                
                // Get room ID from URL
                const roomId = getRoomIdFromUrl();
                if (!roomId) {
                    showError('Không thể xác định ID phòng. Vui lòng truy cập từ trang quản lý phòng.');
                    return;
                }
                
                // Continue with initialization
                await fetchRoomData(roomId);
                await fetchIoTDevices(roomId);
                displayDevices();
                createAddDeviceButton(roomId);
                setupFilters();
                
            } catch (error) {
                console.error('Initialization error:', error);
                showError(`Đã xảy ra lỗi: ${error.message}`);
            }
        });
        
        // Setup navigation
        function setupNavigation() {
            document.getElementById('dashboard-menu-item').addEventListener('click', function() {
                window.location.href = 'it-staff-dashboard.html';
            });
            
            document.getElementById('rooms-menu-item').addEventListener('click', function() {
                window.location.href = 'it-staff-room-management.html';
            });
            
            document.getElementById('devices-menu-item').addEventListener('click', function() {
                // If we're already on the devices page with a room ID, just stay
                const roomId = getRoomIdFromUrl();
                if (!roomId) {
                    window.location.href = 'it-staff-iot-devices.html';
                }
            });
            
            document.getElementById('profile-menu-item').addEventListener('click', function() {
                window.location.href = 'it-staff-profile.html';
            });
            
            document.getElementById('logout-btn').addEventListener('click', function() {
                fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/index.html';
                    }
                })
                .catch(error => {
                    window.location.href = '/index.html';
                });
            });
        }
        
        // Get room ID from URL query parameters
        function getRoomIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('room_id');
        }
        
        // Fetch room data
        async function fetchRoomData(roomId) {
            try {
                const response = await fetch(`${ENDPOINTS.ROOMS}/${roomId}`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch room data: ${response.status}`);
                }
                
                // Check if the response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Received non-JSON response from server');
                }
                
                roomData = await response.json();
                
                // Update room info in UI
                document.getElementById('room-name-display').textContent = roomData.room_name || 'Không có tên';
                document.getElementById('room-id-display').textContent = `ID: ${roomData.id}`;
                
                // Update status display
                const statusDisplay = document.getElementById('room-status-display');
                statusDisplay.textContent = getStatusText(roomData.status);
                statusDisplay.className = `room-status status-${roomData.status}`;
                
            } catch (error) {
                console.error('Error fetching room data:', error);
                
                // Use mock data if API fails
                console.log('Using mock room data instead');
                roomData = MOCK_ROOM;
                usingMockData = true;
                
                // Update UI with mock data
                document.getElementById('room-name-display').textContent = roomData.room_name;
                document.getElementById('room-id-display').textContent = `ID: ${roomData.id}`;
                
                const statusDisplay = document.getElementById('room-status-display');
                statusDisplay.textContent = getStatusText(roomData.status);
                statusDisplay.className = `room-status status-${roomData.status}`;
            }
        }
        
        // Fetch IoT devices
        async function fetchIoTDevices(roomId) {
            try {
                const response = await fetch(`${ENDPOINTS.IOT}/room/${roomId}`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch IoT devices: ${response.status}`);
                }
                
                // Check if the response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Received non-JSON response from server');
                }
                
                devicesList = await response.json();
                
            } catch (error) {
                console.error('Error fetching IoT devices:', error);
                
                // Use mock data if API fails
                console.log('Using mock device data instead');
                devicesList = MOCK_DEVICES;
                usingMockData = true;
            }
        }
        
        // Display devices in UI
        function displayDevices(filtered = false) {
            const container = document.getElementById('devices-container');
            
            // Clear container
            container.innerHTML = '';
            
            // Show mock data notification if needed
            if (usingMockData) {
                const mockNotice = document.createElement('div');
                mockNotice.className = 'mock-data-notice';
                mockNotice.innerHTML = `
                    <i class="fas fa-info-circle"></i>
                    <span>Sử dụng dữ liệu mẫu vì không thể kết nối đến API. Các thay đổi chỉ được lưu tạm thời.</span>
                `;
                mockNotice.style.backgroundColor = '#cce5ff';
                mockNotice.style.color = '#004085';
                mockNotice.style.padding = '10px 15px';
                mockNotice.style.borderRadius = '5px';
                mockNotice.style.marginBottom = '20px';
                mockNotice.style.display = 'flex';
                mockNotice.style.alignItems = 'center';
                mockNotice.style.gap = '10px';
                container.appendChild(mockNotice);
            }
            
            // Get filtered devices based on current filter settings
            let devicesToDisplay = filtered ? getFilteredDevices() : devicesList;
            
            if (!devicesToDisplay || devicesToDisplay.length === 0) {
                container.innerHTML += '<div class="empty-message" style="text-align: center; padding: 30px; color: #6c757d;">Không có thiết bị IoT nào phù hợp với bộ lọc.</div>';
                return;
            }
            
            // Create device cards
            devicesToDisplay.forEach(device => {
                const card = createDeviceCard(device);
                container.appendChild(card);
            });
        }
        
        // Filter devices based on current filter settings
        function getFilteredDevices() {
            const nameSearch = document.getElementById('device-name-search').value.toLowerCase();
            const typeFilter = document.getElementById('device-type-filter').value;
            const statusFilter = document.getElementById('device-status-filter').value;
            const maintenanceFilter = document.getElementById('device-maintenance-filter').value;
            
            return devicesList.filter(device => {
                // Filter by name
                if (nameSearch && !device.device_name.toLowerCase().includes(nameSearch)) {
                    return false;
                }
                
                // Filter by type
                if (typeFilter && device.device_type !== typeFilter) {
                    return false;
                }
                
                // Filter by status (not maintenance)
                if (statusFilter && statusFilter !== 'maintenance' && device.status !== statusFilter) {
                    return false;
                }
                
                // Filter by maintenance
                if (maintenanceFilter === 'maintenance' && device.status !== 'maintenance') {
                    return false;
                }
                
                if (maintenanceFilter === 'normal' && device.status === 'maintenance') {
                    return false;
                }
                
                return true;
            });
        }
        
        // Create a device card
        function createDeviceCard(device) {
            const deviceType = device.device_type;
            const deviceStatus = device.status || 'off';
            const isMaintenanceMode = device.maintenance_mode === 1 || deviceStatus === 'maintenance';
            
            const card = document.createElement('div');
            card.className = 'device-card';
            card.dataset.deviceId = device.id;
            
            // Add maintenance badge if needed
            if (isMaintenanceMode) {
                const maintenanceBadge = document.createElement('div');
                maintenanceBadge.className = 'maintenance-badge';
                maintenanceBadge.innerHTML = '<i class="fas fa-tools"></i> Đang bảo trì';

        // Format date
        function formatDate(dateString) {
            if (!dateString) return null;
            
            try {
                const date = new Date(dateString);
                
                // Check if date is valid
                if (isNaN(date.getTime())) {
                    return null;
                }
                
                // Format date
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                
                return `${day}/${month}/${year} ${hours}:${minutes}`;
            } catch (error) {
                console.error('Error formatting date:', error);
                return null;
            }
        }

        // Upload device image
        async function uploadDeviceImage(deviceId, imageFile) {
            try {
                if (!imageFile) {
                    throw new Error('Vui lòng chọn một hình ảnh');
                }
                
                // Validate file type
                const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                if (!validTypes.includes(imageFile.type)) {
                    throw new Error('Chỉ chấp nhận file hình ảnh (JPEG, PNG, GIF, WEBP)');
                }
                
                // Check file size (max 5MB)
                if (imageFile.size > 5 * 1024 * 1024) {
                    throw new Error('Kích thước file không được vượt quá 5MB');
                }
                
                // If we're using mock data, just show success message
                if (usingMockData) {
                    // Create a fake image URL
                    const fakeImageUrl = URL.createObjectURL(imageFile);
                    
                    // Update device in the list
                    const device = devicesList.find(d => d.id === deviceId);
                    if (device) {
                        device.image_url = fakeImageUrl;
                        
                        // Update UI immediately
                        const deviceCard = document.querySelector(`.device-card[data-device-id="${deviceId}"]`);
                        if (deviceCard) {
                            const imageElement = deviceCard.querySelector('.device-image img');
                            imageElement.src = fakeImageUrl;
                        }
                    }
                    
                    alert('Tải lên hình ảnh thành công (chế độ mẫu)');
                    return;
                }
                
                // Create form data
                const formData = new FormData();
                formData.append('image', imageFile);
                
                const response = await fetch(`${ENDPOINTS.IOT}/${deviceId}/image`, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    try {
                        // Try to parse error as JSON
                        const errorJson = JSON.parse(errorText);
                        throw new Error(errorJson.error || `Failed to upload image: ${response.status}`);
                    } catch (e) {
                        throw new Error(`Failed to upload image: ${response.status}`);
                    }
                }
                
                // Get the response with the new image URL
                const contentType = response.headers.get('content-type');
                let result;
                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    throw new Error('Unexpected non-JSON response from server');
                }
                
                // Update device in the list
                const device = devicesList.find(d => d.id === deviceId);
                if (device && result.device && result.device.image_url) {
                    device.image_url = result.device.image_url;
                    
                    // Update UI
                    const deviceCard = document.querySelector(`.device-card[data-device-id="${deviceId}"]`);
                    if (deviceCard) {
                        const imageElement = deviceCard.querySelector('.device-image img');
                        // Add a timestamp query param to force reload of the image
                        imageElement.src = `${result.device.image_url}?t=${new Date().getTime()}`;
                    }
                }
                
                alert('Tải lên hình ảnh thành công');
                
            } catch (error) {
                console.error('Error uploading device image:', error);
                alert(`Lỗi khi tải lên hình ảnh: ${error.message}`);
            }
        }
        
        // Add a new device to room
        async function addDeviceToRoom(roomId, deviceData) {
            try {
                // Validate data
                if (!deviceData.device_name || !deviceData.device_type) {
                    throw new Error('Tên thiết bị và loại thiết bị không được để trống');
                }
                
                // If we're using mock data, just add to list
                if (usingMockData) {
                    const newId = Math.max(...devicesList.map(d => d.id), 0) + 1;
                    const newDevice = {
                        id: newId,
                        device_name: deviceData.device_name,
                        device_type: deviceData.device_type,
                        room_id: parseInt(roomId),
                        status: 'off',
                        maintenance_mode: 0,
                        last_activity: new Date().toISOString()
                    };
                    
                    // Add to device list
                    devicesList.push(newDevice);
                    
                    // Update mock room's facilities
                    if (!roomData.facilities) {
                        roomData.facilities = {};
                    }
                    if (typeof roomData.facilities === 'string') {
                        try {
                            roomData.facilities = JSON.parse(roomData.facilities);
                        } catch (e) {
                            roomData.facilities = {};
                        }
                    }
                    roomData.facilities[deviceData.device_type] = (roomData.facilities[deviceData.device_type] || 0) + 1;
                    
                    // Display the new device
                    const container = document.getElementById('devices-container');
                    const card = createDeviceCard(newDevice);
                    container.appendChild(card);
                    
                    return newDevice;
                }
                
                // Add room_id to the data
                deviceData.room_id = roomId;
                
                const response = await fetch(ENDPOINTS.IOT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(deviceData)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    try {
                        // Try to parse error as JSON
                        const errorJson = JSON.parse(errorText);
                        throw new Error(errorJson.error || `Failed to add device: ${response.status}`);
                    } catch (e) {
                        throw new Error(`Failed to add device: ${response.status}`);
                    }
                }
                
                // Check content type and get the response
                const contentType = response.headers.get('content-type');
                let result;
                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    throw new Error('Unexpected non-JSON response from server');
                }
                
                // Add the new device to our list
                if (result.device) {
                    devicesList.push(result.device);

                    // Display the new device
                    const container = document.getElementById('devices-container');
                    const card = createDeviceCard(result.device);
                    container.appendChild(card);
                    
                    return result.device;
                }
                
            } catch (error) {
                console.error('Error adding device:', error);
                alert(`Lỗi khi thêm thiết bị: ${error.message}`);
                return null;
            }
        }
        
        // Delete a device
        async function deleteDevice(deviceId) {
            try {
                if (!confirm('Bạn có chắc chắn muốn xóa thiết bị này không?')) {
                    return false;
                }
                
                // Find device before deleting
                const deviceToDelete = devicesList.find(d => d.id === deviceId);
                if (!deviceToDelete) {
                    throw new Error('Không tìm thấy thiết bị để xóa');
                }
                
                const deviceType = deviceToDelete.device_type;
                const roomId = deviceToDelete.room_id;
                
                // If we're using mock data, just remove from list
                if (usingMockData) {
                    // Remove from device list
                    devicesList = devicesList.filter(d => d.id !== deviceId);
                    
                    // Update mock room's facilities
                    if (roomData.facilities && roomData.facilities[deviceType]) {
                        roomData.facilities[deviceType] = Math.max(0, roomData.facilities[deviceType] - 1);
                        if (roomData.facilities[deviceType] === 0) {
                            delete roomData.facilities[deviceType];
                        }
                    }
                    
                    // Remove from UI
                    const deviceCard = document.querySelector(`.device-card[data-device-id="${deviceId}"]`);
                    if (deviceCard) {
                        deviceCard.remove();
                    }
                    
                    // Show empty message if needed
                    if (devicesList.length === 0) {
                        const container = document.getElementById('devices-container');
                        container.innerHTML = '<div class="empty-message">Không có thiết bị IoT nào trong phòng này.</div>';
                    }
                    
                    return true;
                }
                
                const response = await fetch(`${ENDPOINTS.IOT}/${deviceId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    try {
                        // Try to parse error as JSON
                        const errorJson = JSON.parse(errorText);
                        throw new Error(errorJson.error || `Failed to delete device: ${response.status}`);
                    } catch (e) {
                        throw new Error(`Failed to delete device: ${response.status}`);
                    }
                }
                
                
                // Remove from device list
                devicesList = devicesList.filter(d => d.id !== deviceId);
                
                // Remove from UI
                const deviceCard = document.querySelector(`.device-card[data-device-id="${deviceId}"]`);
                if (deviceCard) {
                    deviceCard.remove();
                }
                
                // Show empty message if needed
                if (devicesList.length === 0) {
                    const container = document.getElementById('devices-container');
                    container.innerHTML = '<div class="empty-message">Không có thiết bị IoT nào trong phòng này.</div>';
                }
                
                alert('Xóa thiết bị thành công');
                return true;
                
            } catch (error) {
                console.error('Error deleting device:', error);
                alert(`Lỗi khi xóa thiết bị: ${error.message}`);
                return false;
            }
        }
        // Add styles for the new admin actions
        const style = document.createElement('style');
        style.textContent = `
            .device-admin-actions {
                padding: 15px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                border-top: 1px solid #f0f0f0;
            }
            
            .btn-outline {
                background-color: white;
                border: 1px solid #dee2e6;
                color: #6c757d;
            }
            
            .btn-outline:hover {
                background-color: #f8f9fa;
            }
            
            .btn-danger {
                background-color: #dc3545;
                color: white;
            }
            
            .btn-danger:hover {
                background-color: #c82333;
            }
            
            /* Add button for adding new device */
            .add-device-btn {
                position: fixed;
                bottom: 30px;
                right: 30px;
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background-color: var(--primary-color);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                cursor: pointer;
                z-index: 100;
                transition: transform 0.3s ease, background-color 0.3s ease;
            }
            
            .add-device-btn:hover {
                transform: scale(1.1);
                background-color: #2a6ea8;
            }
        `;
        document.head.appendChild(style);
        
        // Add a function to create an "Add Device" button
        function createAddDeviceButton(roomId) {
            const button = document.createElement('div');
            button.className = 'add-device-btn';
            button.innerHTML = '<i class="fas fa-plus"></i>';
            button.title = 'Thêm thiết bị mới';
            
            button.addEventListener('click', function() {
                showAddDeviceForm(roomId);
            });
            
            document.body.appendChild(button);
            return button;
        }
        
        // Function to show the add device form
        function showAddDeviceForm(roomId) {
            // Create form container
            const formContainer = document.createElement('div');
            formContainer.className = 'modal-overlay';
            formContainer.style.position = 'fixed';
            formContainer.style.top = '0';
            formContainer.style.left = '0';
            formContainer.style.width = '100%';
            formContainer.style.height = '100%';
            formContainer.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
            formContainer.style.display = 'flex';
            formContainer.style.alignItems = 'center';
            formContainer.style.justifyContent = 'center';
            formContainer.style.zIndex = '1000';
            
            // Create form content
            const formContent = document.createElement('div');
            formContent.className = 'modal-content';
            formContent.style.backgroundColor = 'white';
            formContent.style.borderRadius = '10px';
            formContent.style.padding = '20px';
            formContent.style.width = '90%';
            formContent.style.maxWidth = '500px';
            formContent.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.2)';
            
            formContent.innerHTML = `
                <h2 style="margin-top: 0;">Thêm thiết bị mới</h2>
                <form id="add-device-form">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="device-name" style="display: block; margin-bottom: 5px; font-weight: 500;">Tên thiết bị:</label>
                        <input type="text" id="device-name" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 5px;">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="device-type" style="display: block; margin-bottom: 5px; font-weight: 500;">Loại thiết bị:</label>
                        <select id="device-type" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 5px;">
                            <option value="">-- Chọn loại thiết bị --</option>
                            <option value="projector">Máy chiếu</option>
                            <option value="computer">Máy tính</option>
                            <option value="air_conditioner">Điều hòa</option>
                            <option value="speaker">Loa</option>
                            <option value="light">Đèn</option>
                            <option value="fan">Quạt</option>
                        </select>
                    </div>
                    <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn btn-outline" id="cancel-add-device">Hủy</button>
                        <button type="submit" class="btn btn-primary">Thêm thiết bị</button>
                    </div>
                </form>
            `;
            
            formContainer.appendChild(formContent);
            document.body.appendChild(formContainer);
            
            // Handle form submission
            document.getElementById('add-device-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const deviceName = document.getElementById('device-name').value;
                const deviceType = document.getElementById('device-type').value;
                
                if (!deviceName || !deviceType) {
                    alert('Vui lòng điền đầy đủ thông tin');
                    return;
                }
                
                const newDevice = await addDeviceToRoom(roomId, {
                    device_name: deviceName,
                    device_type: deviceType
                });
                
                if (newDevice) {
                    alert('Thêm thiết bị thành công');
                    formContainer.remove();
                }
            });
            
            // Handle cancel button
            document.getElementById('cancel-add-device').addEventListener('click', function() {
                formContainer.remove();
            });
            
            // Close on overlay click
            formContainer.addEventListener('click', function(e) {
                if (e.target === formContainer) {
                    formContainer.remove();
                }
            });
        }
        
        // Setup filter event listeners
        function setupFilters() {
            // Input events for search box (with debounce)
            let debounceTimeout;
            document.getElementById('device-name-search').addEventListener('input', function() {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(() => {
                    displayDevices(true);
                }, 300);
            });
            
            // Change events for dropdowns
            document.getElementById('device-type-filter').addEventListener('change', function() {
                displayDevices(true);
            });
            
            document.getElementById('device-status-filter').addEventListener('change', function() {
                displayDevices(true);
            });
            
            document.getElementById('device-maintenance-filter').addEventListener('change', function() {
                displayDevices(true);
            });
            
            // Reset filters button
            document.getElementById('reset-filters').addEventListener('click', function() {
                document.getElementById('device-name-search').value = '';
                document.getElementById('device-type-filter').value = '';
                document.getElementById('device-status-filter').value = '';
                document.getElementById('device-maintenance-filter').value = '';
                displayDevices(false);
            });
        }
    </script>
</body>
